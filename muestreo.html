<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Muestreos</title>
<meta name="description" content="Simulación pedagógica interactiva de estadística y muestreo: distingue técnicas probabilísticas y no probabilísticas mediante simulaciones visuales. SimLab ULEAM.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg:#0A1410;--bg-panel:#0D1A14;--bg-card:#13241C;--bg-card-alt:#1A2E25;
  --fg:#DFF0E4;--fg-muted:#5F9172;--accent:#34D399;--accent-glow:rgba(52,211,153,.25);
  --warm:#FBBF24;--warm-glow:rgba(251,191,36,.2);--error:#F87171;--error-glow:rgba(248,113,113,.2);
  --border:#1B3328;--border-light:#264A38;--radius:12px;
  --sim-home-fg:#34d399;--sim-home-bg:rgba(52,211,153,0.12);--sim-home-bd:rgba(52,211,153,0.22);--sim-home-hi:#34d399;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;font-weight:700}

/* Fondo ambiente */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 600px 400px at 15% 20%,rgba(52,211,153,.06),transparent),
  radial-gradient(ellipse 500px 500px at 85% 80%,rgba(251,191,36,.04),transparent),
  radial-gradient(ellipse 800px 600px at 50% 50%,rgba(52,211,153,.02),transparent)}

/* Layout */
#app{display:flex;min-height:100vh;position:relative;z-index:1}

/* Panel glosario */
#glosario-panel{width:320px;min-width:320px;background:var(--bg-panel);border-right:1px solid var(--border);
  height:100vh;overflow-y:auto;position:sticky;top:0;padding:28px 20px;
  transition:transform .4s cubic-bezier(.4,0,.2,1)}
#glosario-panel::-webkit-scrollbar{width:4px}
#glosario-panel::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:4px}
.glosario-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.glosario-logo i{color:var(--accent);font-size:20px}
.glosario-logo h2{font-size:18px;color:var(--fg);letter-spacing:-.3px}
.glosario-item{margin-bottom:16px}
.glosario-term{display:flex;align-items:center;gap:8px;cursor:pointer;padding:10px 12px;border-radius:8px;
  background:var(--bg-card);border:1px solid var(--border);transition:all .25s}
.glosario-term:hover{border-color:var(--border-light);background:var(--bg-card-alt)}
.glosario-term i{color:var(--accent);font-size:14px;width:20px;text-align:center;flex-shrink:0}
.glosario-term span{font-weight:600;font-size:13.5px;flex:1}
.glosario-term .chevron{color:var(--fg-muted);font-size:11px;transition:transform .3s}
.glosario-term.open .chevron{transform:rotate(180deg)}
.glosario-def{padding:10px 12px 6px 40px;font-size:13px;color:var(--fg-muted);line-height:1.6;
  max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s}
.glosario-def.open{max-height:300px;padding-bottom:14px}
.glosario-subtipo{display:flex;align-items:flex-start;gap:6px;margin-top:6px;font-size:12.5px}
.glosario-subtipo::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:5px}
.glosario-subtipo strong{color:var(--fg);font-weight:600}

/* Botón toggle glosario (mobile) */
#glosario-toggle{display:none;position:fixed;top:16px;left:16px;z-index:100;
  width:44px;height:44px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg-card);color:var(--accent);font-size:18px;cursor:pointer;
  transition:all .25s;align-items:center;justify-content:center}
#glosario-toggle:hover{background:var(--bg-card-alt);border-color:var(--accent)}

/* Área principal */
#main-area{flex:1;display:flex;flex-direction:column;min-width:0}

/* Barra de progreso */
#progress-container{padding:16px 32px;background:var(--bg-panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px}
#progress-text{font-size:13px;color:var(--fg-muted);white-space:nowrap;font-weight:500;min-width:160px}
#progress-text .fase-badge{display:inline-block;background:var(--bg-card-alt);color:var(--warm);padding:2px 8px;
  border-radius:4px;font-size:11px;font-weight:700;margin-right:6px;letter-spacing:.5px}
#progress-bar-outer{flex:1;height:6px;background:var(--bg-card);border-radius:3px;overflow:hidden}
#progress-bar-inner{height:100%;background:linear-gradient(90deg,var(--accent),var(--warm));border-radius:3px;
  width:0%;transition:width .6s cubic-bezier(.4,0,.2,1)}
#score-display{font-size:13px;color:var(--warm);font-weight:700;white-space:nowrap}

/* Contenedor de pantallas */
#screen-container{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.screen{display:none;flex-direction:column;align-items:center;width:100%;max-width:820px;animation:fadeInUp .5s ease}
.screen.active{display:flex}

/* Pantalla inicio */
.inicio-icon{font-size:64px;margin-bottom:20px;animation:float 3s ease-in-out infinite}
.inicio-titulo{font-size:38px;letter-spacing:-1px;margin-bottom:8px;text-align:center}
.inicio-titulo .accent{color:var(--accent)}
.inicio-sub{font-size:16px;color:var(--fg-muted);margin-bottom:36px;text-align:center;max-width:500px;line-height:1.6}
.inicio-features{display:flex;gap:16px;margin-bottom:40px;flex-wrap:wrap;justify-content:center}
.inicio-feat{display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--border);
  padding:10px 16px;border-radius:8px;font-size:13px;color:var(--fg-muted)}
.inicio-feat i{color:var(--accent)}
.btn-primary{padding:14px 36px;border-radius:10px;border:none;background:var(--accent);color:#0A1410;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;cursor:pointer;
  transition:all .25s;letter-spacing:-.3px}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--accent-glow)}
.btn-primary:active{transform:translateY(0)}

/* Pantalla ejercicio */
.ej-header{text-align:center;margin-bottom:20px;width:100%}
.ej-titulo{font-size:22px;letter-spacing:-.5px;display:flex;align-items:center;justify-content:center;gap:10px}
.ej-titulo .ej-icon{font-size:28px}
.ej-pob-info{font-size:13px;color:var(--fg-muted);margin-top:4px}

/* Lienzo de población */
.poblacion-canvas{width:100%;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;position:relative;min-height:200px;margin-bottom:16px;overflow:hidden}
.poblacion-canvas::before{content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:24px 24px;opacity:.4;pointer-events:none}
.poblacion-grid{display:grid;gap:6px;position:relative;z-index:1;justify-content:center}
.pob-elemento{width:46px;height:46px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;position:relative;transition:all .5s cubic-bezier(.4,0,.2,1);cursor:default;
  border:2px solid transparent;background:var(--bg-card-alt)}
.pob-emoji{font-size:22px;transition:transform .4s}
.pob-num{position:absolute;top:-7px;right:-7px;font-size:9px;font-weight:700;
  background:var(--bg-panel);color:var(--fg-muted);width:18px;height:18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;opacity:0;transition:all .35s;
  border:1px solid var(--border);font-family:'Space Grotesk',sans-serif}
.pob-num.visible{opacity:1}
.pob-num.highlight{background:var(--accent);color:#0A1410;border-color:var(--accent)}
.pob-elemento.selected{transform:scale(1.15);border-color:var(--accent);
  box-shadow:0 0 16px var(--accent-glow),0 0 4px var(--accent-glow);z-index:2;background:rgba(52,211,153,.08)}
.pob-elemento.selected .pob-emoji{transform:scale(1.1)}
.pob-elemento.dimmed{opacity:.18;transform:scale(.88);filter:grayscale(.5)}
.pob-elemento.wave-1{border-color:#F87171;box-shadow:0 0 12px rgba(248,113,113,.3)}
.pob-elemento.wave-2{border-color:#FBBF24;box-shadow:0 0 12px rgba(251,191,36,.3)}
.pob-elemento.wave-3{border-color:#60A5FA;box-shadow:0 0 12px rgba(96,165,250,.3)}
.pob-elemento.wave-4{border-color:#C084FC;box-shadow:0 0 12px rgba(192,132,252,.3)}
.pob-elemento.cuota-selected{border-color:var(--warm);box-shadow:0 0 12px var(--warm-glow);transform:scale(1.1);z-index:2}

/* Overlays de animación */
.anim-overlay{position:absolute;z-index:5;pointer-events:none}
.conveniencia-marker{top:12px;left:12px;display:flex;align-items:center;gap:6px;
  background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);padding:6px 12px;border-radius:6px;
  font-size:12px;color:var(--warm);font-weight:600;opacity:0;transition:opacity .4s}
.conveniencia-marker.show{opacity:1}
.conveniencia-spotlight{position:absolute;top:0;left:0;width:45%;height:45%;
  background:radial-gradient(ellipse at 0% 0%,rgba(251,191,36,.08),transparent 70%);
  opacity:0;transition:opacity .6s}
.conveniencia-spotlight.show{opacity:1}
.juicio-eye{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:40px;opacity:0;transition:opacity .4s;filter:drop-shadow(0 0 12px rgba(251,191,36,.4))}
.juicio-eye.show{opacity:1}
.estratificado-label{position:absolute;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;
  opacity:0;transition:opacity .4s;white-space:nowrap}
.estratificado-label.show{opacity:1}
.conglomerado-box{position:absolute;border:2px dashed var(--border-light);border-radius:8px;
  opacity:0;transition:all .5s}
.conglomerado-box.show{opacity:1;border-color:var(--accent);background:rgba(52,211,153,.04)}
.conglomerado-box.selected-box{border-color:var(--accent);border-style:solid;background:rgba(52,211,153,.06);
  box-shadow:0 0 16px var(--accent-glow)}
.cuotas-panel{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:12px;
  opacity:0;transition:opacity .4s;min-width:140px}
.cuotas-panel.show{opacity:1}
.cuota-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:11px;color:var(--fg-muted)}
.cuota-row:last-child{margin-bottom:0}
.cuota-dots{display:flex;gap:3px}
.cuota-dot{width:14px;height:14px;border-radius:4px;border:1px dashed var(--border-light);
  transition:all .3s}
.cuota-dot.filled{background:var(--warm);border-color:var(--warm);border-style:solid}
.bola-nieve-badge{position:absolute;font-size:9px;font-weight:800;width:16px;height:16px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0A1410;
  opacity:0;transition:all .35s;bottom:-6px;right:-6px;z-index:3;font-family:'Space Grotesk',sans-serif}
.bola-nieve-badge.show{opacity:1;transform:scale(1)}

/* Narrativa */
.narrativa-card{width:100%;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 22px;margin-bottom:20px;animation:fadeInUp .4s ease}
.narrativa-label{font-size:11px;color:var(--warm);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.narrativa-text{font-size:15px;line-height:1.7;color:var(--fg)}
.btn-ver{padding:12px 28px;border-radius:8px;border:1px solid var(--accent);background:transparent;
  color:var(--accent);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;
  cursor:pointer;transition:all .25s;margin-bottom:20px}
.btn-ver:hover{background:var(--accent);color:#0A1410}
.btn-ver:disabled{opacity:.4;cursor:not-allowed;border-color:var(--border-light);color:var(--fg-muted)}
.btn-ver:disabled:hover{background:transparent;color:var(--fg-muted)}

/* Preguntas */
.pregunta-card{width:100%;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;animation:fadeInUp .4s ease}
.pregunta-text{font-size:16px;font-weight:600;margin-bottom:16px;text-align:center;line-height:1.5}
.pregunta-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-respuesta{padding:14px 28px;border-radius:10px;border:2px solid var(--border);
  background:var(--bg-card-alt);color:var(--fg);font-family:'Space Grotesk',sans-serif;font-weight:600;
  font-size:14px;cursor:pointer;transition:all .25s;min-width:180px;text-align:center}
.btn-respuesta:hover{border-color:var(--accent);background:rgba(52,211,153,.06);transform:translateY(-2px)}
.btn-respuesta.correct{border-color:var(--accent);background:rgba(52,211,153,.12);color:var(--accent);
  box-shadow:0 0 20px var(--accent-glow)}
.btn-respuesta.wrong{border-color:var(--error);background:rgba(248,113,113,.08);color:var(--error);
  box-shadow:0 0 20px var(--error-glow)}
.btn-respuesta:disabled{cursor:not-allowed;transform:none!important}
.btn-respuesta .btn-sub{display:block;font-size:11px;font-weight:400;color:var(--fg-muted);margin-top:4px}
.btn-respuesta.correct .btn-sub{color:rgba(52,211,153,.7)}
.btn-respuesta.wrong .btn-sub{color:rgba(248,113,113,.7)}

/* Feedback */
.feedback-card{width:100%;padding:20px 24px;border-radius:var(--radius);margin-top:16px;
  animation:fadeInUp .4s ease;border:1px solid}
.feedback-card.acierto{background:rgba(52,211,153,.06);border-color:rgba(52,211,153,.2)}
.feedback-card.error{background:rgba(248,113,113,.05);border-color:rgba(248,113,113,.15)}
.feedback-icon{font-size:24px;margin-bottom:8px}
.feedback-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;margin-bottom:6px}
.feedback-text{font-size:14px;color:var(--fg-muted);line-height:1.7}
.feedback-text strong{color:var(--fg);font-weight:600}
.btn-siguiente{padding:12px 28px;border-radius:8px;border:none;background:var(--bg-card-alt);
  color:var(--fg);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;
  cursor:pointer;transition:all .25s;margin-top:16px;border:1px solid var(--border)}
.btn-siguiente:hover{border-color:var(--accent);transform:translateY(-1px)}

/* Pista */
.pista-btn{font-size:12px;color:var(--fg-muted);background:none;border:none;cursor:pointer;
  margin-top:12px;text-decoration:underline;text-underline-offset:3px;transition:color .2s}
.pista-btn:hover{color:var(--warm)}
.pista-text{font-size:13px;color:var(--warm);margin-top:8px;font-style:italic;opacity:.85}

/* Pantalla transición */
.transicion-icon{font-size:56px;margin-bottom:20px;animation:float 2.5s ease-in-out infinite}
.transicion-titulo{font-size:28px;margin-bottom:10px;text-align:center}
.transicion-sub{font-size:15px;color:var(--fg-muted);text-align:center;max-width:460px;line-height:1.7;margin-bottom:32px}
.transicion-features{display:flex;gap:12px;margin-bottom:32px;flex-wrap:wrap;justify-content:center}
.transicion-feat{background:var(--bg-card);border:1px solid var(--border);padding:10px 16px;border-radius:8px;
  font-size:13px;color:var(--fg-muted);display:flex;align-items:center;gap:6px}
.transicion-feat i{color:var(--warm)}

/* Pantalla final */
.final-titulo{font-size:30px;margin-bottom:6px;text-align:center}
.final-rango{font-size:18px;margin-bottom:6px;text-align:center}
.final-puntos{font-size:14px;color:var(--fg-muted);margin-bottom:28px;text-align:center}
.final-tabla{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:24px}
.final-tabla thead th{background:var(--bg-card);color:var(--fg-muted);font-weight:600;font-size:11px;
  text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;text-align:left;border-bottom:2px solid var(--border)}
.final-tabla tbody td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.final-tabla tbody tr:hover{background:var(--bg-card)}
.badge-prob{background:rgba(52,211,153,.12);color:var(--accent);padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700}
.badge-no-prob{background:rgba(251,191,36,.1);color:var(--warm);padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700}
.badge-subtipo{background:var(--bg-card-alt);color:var(--fg-muted);padding:3px 8px;border-radius:4px;font-size:11px}
.icon-ok{color:var(--accent)}
.icon-fail{color:var(--error)}
.final-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* Animaciones */
@keyframes fadeInUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes popIn{0%{transform:scale(0);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 8px var(--accent-glow)}50%{box-shadow:0 0 20px var(--accent-glow),0 0 40px rgba(52,211,153,.1)}}

/* Responsive */
@media(max-width:900px){
  #glosario-panel{position:fixed;left:0;top:0;z-index:90;transform:translateX(-100%)}
  #glosario-panel.open{transform:translateX(0)}
  #glosario-toggle{display:flex}
  #main-area{margin-left:0}
  #progress-container{padding:14px 16px;padding-left:56px}
  #screen-container{padding:16px}
  .pob-elemento{width:38px;height:38px}
  .pob-emoji{font-size:18px}
  .pob-num{width:15px;height:15px;font-size:8px;top:-5px;right:-5px}
  .btn-respuesta{min-width:140px;padding:12px 18px;font-size:13px}
  .inicio-titulo{font-size:28px}
  .final-tabla{font-size:11px}
  .final-tabla thead th,.final-tabla tbody td{padding:8px 6px}
}
@media(max-width:500px){
  .pob-elemento{width:32px;height:32px;border-radius:6px}
  .pob-emoji{font-size:15px}
  .poblacion-grid{gap:4px}
  .poblacion-canvas{padding:14px 10px}
  .pregunta-btns{flex-direction:column;align-items:stretch}
  .btn-respuesta{min-width:auto}
  .inicio-features{flex-direction:column;align-items:center}
  .transicion-features{flex-direction:column;align-items:center}
}

.sim-home{position:fixed;top:14px;left:14px;z-index:200;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;text-decoration:none;
  color:var(--sim-home-fg);background:var(--sim-home-bg);
  border:1px solid var(--sim-home-bd);border-radius:10px;
  transition:transform .2s, color .2s}
.sim-home:hover,.sim-home:focus-visible{color:var(--sim-home-hi);transform:scale(1.06)}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<a href="index.html" class="sim-home" title="Volver al inicio" aria-label="Volver al inicio del SimLab">
  <i class="fa-solid fa-house" aria-hidden="true"></i>
</a>
<button id="glosario-toggle" aria-label="Abrir glosario"><i class="fas fa-book"></i></button>
<div id="app">
  <aside id="glosario-panel"></aside>
  <main id="main-area">
    <div id="progress-container" style="display:none">
      <div id="progress-text"></div>
      <div id="progress-bar-outer"><div id="progress-bar-inner"></div></div>
      <div id="score-display"></div>
    </div>
    <div id="screen-container">
      <div id="screen-inicio" class="screen active"></div>
      <div id="screen-ejercicio" class="screen"></div>
      <div id="screen-transicion" class="screen"></div>
      <div id="screen-final" class="screen"></div>
    </div>
  </main>
</div>

<script>
/* ========== DATOS ========== */
const GLOSARIO = [
  { termino:"Población", icono:"fa-users", definicion:"Conjunto completo de elementos (personas, animales, plantas, objetos) sobre los que se desea obtener información." },
  { termino:"Muestra", icono:"fa-vial", definicion:"Subconjunto de la población que se selecciona para estudiarlo directamente. Debe ser representativa." },
  { termino:"Muestreo", icono:"fa-filter", definicion:"Procedimiento o técnica utilizado para seleccionar los elementos que conformarán la muestra." },

function obtenerNombreUsuario(callback) {
  const guardado = sessionStorage.getItem('nombreEstudianteSim');
  if (guardado) { callback(guardado); return; }
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:99999;';
  overlay.innerHTML = `
    <div style="background:#1a1a2e;color:#e0e0e0;padding:32px;border-radius:14px;max-width:380px;width:90%;text-align:center;border:1px solid var(--accent);font-family:inherit;box-shadow:0 20px 60px rgba(0,0,0,.5)">
      <h3 style="margin:0 0 12px;color:var(--accent)">¿Cómo te llamas?</h3>
      <p style="font-size:.85rem;opacity:.75;margin:0 0 16px;line-height:1.5">Para personalizar tu resultado. Tu nombre solo se usa en esta sesión del navegador y no se guarda ni se envía a ningún servidor.</p>
      <input id="inputNombreUsuario" type="text" placeholder="Tu nombre" style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--accent);background:rgba(255,255,255,.05);color:inherit;margin-bottom:16px;box-sizing:border-box;font-size:1rem">
      <button id="btnConfirmarNombre" style="padding:10px 28px;border:none;border-radius:6px;background:var(--accent);color:#000;font-weight:700;cursor:pointer;font-size:1rem">Continuar</button>
    </div>`;
  document.body.appendChild(overlay);
  const input = overlay.querySelector('#inputNombreUsuario');
  input.focus();
  const confirmar = () => {
    const nombre = input.value.trim() || 'Estudiante';
    sessionStorage.setItem('nombreEstudianteSim', nombre);
    overlay.remove();
    callback(nombre);
  };
  overlay.querySelector('#btnConfirmarNombre').addEventListener('click', confirmar);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') confirmar(); });
}

/* ========== UTILIDADES ========== */
function delay(ms){ return new Promise(r => setTimeout(r, ms)); }

function shuffleSeed(arr, seed){
  let s = seed;
  const a = [...arr];
  for(let i = a.length-1; i > 0; i--){
    s = (s * 16807) % 2147483647;
    const j = s % (i+1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generarElementos(ej){
  const {grupos} = ej.poblacion;
  let elems = [];
  let idx = 0;
  grupos.forEach((g, gi) => {
    for(let i = 0; i < g.cantidad; i++){
      elems.push({ idx: idx++, grupoIdx: gi, nombre: g.nombre, emoji: g.emoji, color: g.color });
    }
  });
  if(ej.distribucion === 'mezclado'){
    elems = shuffleSeed(elems, ej.id * 7919);
  }
  // Asignar posición de display
  elems.forEach((el, i) => el.pos = i);
  return elems;
}

/* ========== RENDER GLOSARIO ========== */
function renderGlosario(){
  const panel = document.getElementById('glosario-panel');
  let html = `<div class="glosario-logo"><i class="fas fa-flask"></i><h2>Glosario</h2></div>`;
  GLOSARIO.forEach((g, i) => {
    html += `<div class="glosario-item">
      <div class="glosario-term" data-glosario="${i}" onclick="toggleGlosario(${i})">
        <i class="fas ${g.icono}"></i><span>${g.termino}</span><i class="fas fa-chevron-down chevron"></i>
      </div>
      <div class="glosario-def" id="glosario-def-${i}">${g.definicion}`;
    if(g.subtipos){
      g.subtipos.forEach(st => {
        html += `<div class="glosario-subtipo"><strong>${st.nombre}:</strong> ${st.desc}</div>`;
      });
    }
    html += `</div></div>`;
  });
  panel.innerHTML = html;
}

function toggleGlosario(i){
  const term = document.querySelector(`[data-glosario="${i}"]`);
  const def = document.getElementById(`glosario-def-${i}`);
  const isOpen = term.classList.contains('open');
  // Cerrar todos
  document.querySelectorAll('.glosario-term').forEach(t => t.classList.remove('open'));
  document.querySelectorAll('.glosario-def').forEach(d => d.classList.remove('open'));
  if(!isOpen){ term.classList.add('open'); def.classList.add('open'); }
}

/* ========== EJERCICIO ========== */
function cargarEjercicio(){
  const ej = EJERCICIOS[state.ejercicioActual];
  const elementos = generarElementos(ej);
  const cols = ej.poblacion.columns;

  // Actualizar progreso
  document.getElementById('progress-container').style.display = 'flex';
  actualizarProgreso();

  // Info de población
  let pobInfo = `Población: ${ej.poblacion.total} elementos`;
  if(ej.poblacion.grupos.length > 1){
    pobInfo += ' (' + ej.poblacion.grupos.map(g => `${g.cantidad} ${g.nombre}`).join(', ') + ')';
  }

  const screen = document.getElementById('screen-ejercicio');
  screen.innerHTML = `
    <div class="ej-header">
      <div class="ej-titulo"><span class="ej-icon">${ej.icono}</span>${ej.titulo}</div>
      <div class="ej-pob-info">${pobInfo}</div>
    </div>
    <div class="poblacion-canvas" id="poblacion-canvas">
      <div class="poblacion-grid" id="poblacion-grid" style="grid-template-columns:repeat(${cols},46px)"></div>
    </div>
    <div id="ej-dinamico"></div>
  `;

  // Responsive grid
  if(window.innerWidth <= 500){
    document.getElementById('poblacion-grid').style.gridTemplateColumns = `repeat(${cols},32px)`;
  }

  // Renderizar elementos
  const grid = document.getElementById('poblacion-grid');
  elementos.forEach((el, i) => {
    const div = document.createElement('div');
    div.className = 'pob-elemento';
    div.dataset.pos = el.pos;
    div.style.animation = `popIn .3s ease backwards`;
    div.style.animationDelay = `${i * 18}ms`;
    div.style.borderColor = el.color + '30';
    div.innerHTML = `<span class="pob-emoji">${el.emoji}</span><span class="pob-num">${el.pos + 1}</span>`;
    grid.appendChild(div);
  });

  // Mostrar narrativa después de que aparezcan los elementos
  setTimeout(() => mostrarNarrativa(ej), elementos.length * 18 + 300);
  mostrarPantalla('ejercicio');
}

/* ========== ANIMACIONES ========== */
async function iniciarAnimacion(){
  const btn = document.getElementById('btn-ver');
  btn.disabled = true;
  const ej = EJERCICIOS[state.ejercicioActual];
  await animarSeleccion(ej);
  mostrarPreguntaP1(ej);
}

async function animarSeleccion(ej){
  const canvas = document.getElementById('poblacion-canvas');
  const elems = document.querySelectorAll('.pob-elemento');
  const sel = new Set(ej.seleccionados);
  const tipo = ej.animacion;

  switch(tipo){
    case 'aleatorio_simple':
      // Mostrar números
      elems.forEach(el => el.querySelector('.pob-num').classList.add('visible'));
      await delay(700);
      // Resaltar números seleccionados
      sel.forEach(idx => {
        const el = elems[idx]; if(el) el.querySelector('.pob-num').classList.add('highlight');
      });
      await delay(500);
      // Destacar y atenuar
      elems.forEach((el, i) => { if(sel.has(i)) el.classList.add('selected'); else el.classList.add('dimmed'); });
      break;

    case 'sistematico':
      elems.forEach(el => el.querySelector('.pob-num').classList.add('visible'));
      await delay(700);
      // Marcar en secuencia
      const sortedSel = [...sel].sort((a,b) => a-b);
      for(const idx of sortedSel){
        const el = elems[idx];
        if(el){
          el.querySelector('.pob-num').classList.add('highlight');
          el.classList.add('selected');
        }
        await delay(250);
      }
      elems.forEach((el, i) => { if(!sel.has(i)) el.classList.add('dimmed'); });
      break;

    case 'estratificado': {
      // Mostrar etiquetas de estrato
      const grupos = ej.poblacion.grupos;
      let grupoStart = 0;
      grupos.forEach((g, gi) => {
        const label = document.createElement('div');
        label.className = 'estratificado-label anim-overlay';
        label.style.background = g.color + '20';
        label.style.color = g.color;
        label.style.border = `1px solid ${g.color}40`;
        label.textContent = g.nombre;
        // Posicionar al inicio del bloque
        const startEl = elems[grupoStart];
        if(startEl){
          const r = Math.floor(grupoStart / ej.poblacion.columns);
          label.style.top = `${r * 52 + 20}px`;
          label.style.left = '4px';
        }
        canvas.appendChild(label);
        setTimeout(() => label.classList.add('show'), 100);
        grupoStart += g.cantidad;
      });
      await delay(900);
      // Seleccionar
      sel.forEach(idx => { if(elems[idx]) elems[idx].classList.add('selected'); });
      elems.forEach((el, i) => { if(!sel.has(i)) el.classList.add('dimmed'); });
      break;
    }

    case 'conglomerados': {
      const cols = ej.poblacion.columns;
      const filas = Math.ceil(ej.poblacion.total / cols);
      const selFilas = new Set(ej.conglomeradosFilas);
      // Dibujar recuadros
      for(let f = 0; f < filas; f++){
        const box = document.createElement('div');
        box.className = 'conglomerado-box anim-overlay';
        box.style.top = `${f * 52 + 12}px`;
        box.style.left = '8px';
        box.style.width = `${cols * 52 - 8}px`;
        box.style.height = '46px';
        canvas.appendChild(box);
        setTimeout(() => box.classList.add('show'), f * 150);
      }
      await delay(filas * 150 + 500);
      // Iluminar filas seleccionadas
      selFilas.forEach(f => {
        const boxes = canvas.querySelectorAll('.conglomerado-box');
        if(boxes[f]) boxes[f].classList.add('selected-box');
        for(let c = 0; c < cols; c++){
          const idx = f * cols + c;
          if(elems[idx]) elems[idx].classList.add('selected');
        }
      });
      elems.forEach((el, i) => {
        const fila = Math.floor(i / cols);
        if(!selFilas.has(fila)) el.classList.add('dimmed');
      });
      break;
    }

    case 'conveniencia': {
      // Spotlight y marcador
      const marker = document.createElement('div');
      marker.className = 'conveniencia-marker anim-overlay';
      marker.innerHTML = '<i class="fas fa-door-open"></i> Entrada / Acceso';
      canvas.appendChild(marker);
      const spot = document.createElement('div');
      spot.className = 'conveniencia-spotlight anim-overlay';
      canvas.appendChild(spot);
      setTimeout(() => { marker.classList.add('show'); spot.classList.add('show'); }, 100);
      await delay(800);
      sel.forEach(idx => { if(elems[idx]) elems[idx].classList.add('selected'); });
      elems.forEach((el, i) => { if(!sel.has(i)) el.classList.add('dimmed'); });
      break;
    }

    case 'juicio': {
      const eye = document.createElement('div');
      eye.className = 'juicio-eye anim-overlay';
      eye.textContent = '👁️';
      canvas.appendChild(eye);
      setTimeout(() => eye.classList.add('show'), 100);
      await delay(600);
      sel.forEach(idx => { if(elems[idx]) elems[idx].classList.add('selected'); });
      elems.forEach((el, i) => { if(!sel.has(i)) el.classList.add('dimmed'); });
      await delay(400);
      eye.style.opacity = '0';
      break;
    }

    case 'bola_nieve': {
      const olas = ej.bolaNieveOlas;
      const colores = ['#F87171','#FBBF24','#60A5FA','#C084FC'];
      for(let w = 0; w < olas.length; w++){
        for(const idx of olas[w]){
          const el = elems[idx];
          if(el){
            el.classList.add('selected', `wave-${w+1}`);
            // Badge de ola
            const badge = document.createElement('div');
            badge.className = 'bola-nieve-badge anim-overlay';
            badge.style.background = colores[w];
            badge.textContent = w + 1;
            el.appendChild(badge);
            setTimeout(() => badge.classList.add('show'), 50);
          }
        }
        await delay(600);
      }
      elems.forEach((el, i) => {
        if(!sel.has(i)) el.classList.add('dimmed');
      });
      break;
    }

    case 'cuotas': {
      // Panel de cuotas
      const panel = document.createElement('div');
      panel.className = 'cuotas-panel anim-overlay';
      let panelHtml = '';
      ej.cuotas.forEach(c => {
        panelHtml += `<div class="cuota-row"><span>${c.nombre}:</span><div class="cuota-dots">`;
        for(let d = 0; d < c.cantidad; d++){
          panelHtml += `<div class="cuota-dot" data-cuota="${c.nombre}-${d}"></div>`;
        }
        panelHtml += `</div></div>`;
      });
      panel.innerHTML = panelHtml;
      canvas.appendChild(panel);
      setTimeout(() => panel.classList.add('show'), 100);
      await delay(600);
      // Llenar cuotas en orden
      for(const c of ej.cuotas){
        for(let d = 0; d < c.indices.length; d++){
          const idx = c.indices[d];
          const el = elems[idx];
          const dot = panel.querySelector(`[data-cuota="${c.nombre}-${d}"]`);
          if(el) el.classList.add('cuota-selected');
          if(dot) dot.classList.add('filled');
          await delay(350);
        }
      }
      elems.forEach((el, i) => {
        if(!sel.has(i)) el.classList.add('dimmed');
      });
      break;
    }
  }
  await delay(300);
}

/* ========== PREGUNTAS ========== */
function mostrarPreguntaP1(ej){
  const dyn = document.getElementById('ej-dinamico');
  const muestraInfo = `Muestra seleccionada: ${ej.muestraCantidad} elementos`;
  dyn.innerHTML = `
    <div class="pregunta-card">
      <div style="text-align:center;font-size:13px;color:var(--fg-muted);margin-bottom:14px">${muestraInfo}</div>
      <div class="pregunta-text">Este metodo de muestreo es...</div>
      <div class="pregunta-btns">
        <button class="btn-respuesta" onclick="responderP1(true)">
          <i class="fas fa-dice" style="margin-right:6px"></i>Probabilistico
          <span class="btn-sub">Todos tienen probabilidad conocida</span>
        </button>
        <button class="btn-respuesta" onclick="responderP1(false)">
          <i class="fas fa-hand-pointer" style="margin-right:6px"></i>No Probabilistico
          <span class="btn-sub">Depende del criterio del investigador</span>
        </button>
      </div>
      <div style="text-align:center">
        <button class="pista-btn" id="btn-pista" onclick="mostrarPista()">Necesito una pista</button>
        <div id="pista-contenido"></div>
      </div>
      <div id="feedback-area"></div>
    </div>
  `;
  // Temporizador de pista
  state.pistaTimer = setTimeout(() => {
    const btn = document.getElementById('btn-pista');
    if(btn) btn.style.color = 'var(--warm)';
  }, 6000);
}

function mostrarPista(){
  const ej = EJERCICIOS[state.ejercicioActual];
  const contenido = document.getElementById('pista-contenido');
  if(ej.tipo === 'probabilistico'){
    contenido.innerHTML = `<p class="pista-text">Piensa: &iquest;Se menciona alg&uacute;n mecanismo de azar, sorteo, numeraci&oacute;n o intervalo fijo?</p>`;
  } else {
    contenido.innerHTML = `<p class="pista-text">Piensa: &iquest;La elecci&oacute;n depende de la comodidad, el criterio personal o la referencia de otros?</p>`;
  }
}

function responderP1(elUsuarioDijoProb){
  clearTimeout(state.pistaTimer);
  const ej = EJERCICIOS[state.ejercicioActual];
  const esProbReal = ej.tipo === 'probabilistico';
  const acierto = elUsuarioDijoProb === esProbReal;
  const btns = document.querySelectorAll('.btn-respuesta');
  btns.forEach(b => b.disabled = true);

  // Marcar botones
  btns[elUsuarioDijoProb ? 0 : 1].classList.add(acierto ? 'correct' : 'wrong');
  if(!acierto){
    btns[esProbReal ? 0 : 1].classList.add('correct');
  }

  // Guardar resultado parcial
  const resultado = {
    ejercicioId: ej.id,
    titulo: `${ej.icono} ${ej.titulo}`,
    tipoReal: ej.tipo,
    subtipoReal: ej.subtipo,
    p1Respuesta: elUsuarioDijoProb ? 'probabilistico' : 'noProbabilistico',
    p1Correcta: acierto,
    p2Respuesta: null,
    p2Correcta: null,
    puntos: 0
  };

  if(ej.fase === 1){
    // Fase 1: solo P1
    if(acierto) resultado.puntos = 10;
    state.resultados.push(resultado);
    state.puntaje += resultado.puntos;
    actualizarProgreso();
    mostrarFeedback(acierto, ej.explicacionP1 + (acierto ? ` Es un muestreo <strong>${ej.subtipo}</strong>.` : ''), ej.fase);
  } else {
    // Fase 2: si acierta P1, pasar a P2; si falla, feedback y siguiente
    if(acierto){
      resultado.puntos = 5; // mínimo por acertar P1
      state.puntaje += 5;
      actualizarProgreso();
      setTimeout(() => mostrarPreguntaP2(ej, resultado), 800);
    } else {
      resultado.puntos = 0;
      state.resultados.push(resultado);
      actualizarProgreso();
      mostrarFeedback(false, ej.explicacionP1 + ` Es un muestreo <strong>${ej.subtipo}</strong>.`, ej.fase);
    }
  }
}

function mostrarPreguntaP2(ej, resultado){
  const area = document.getElementById('feedback-area');
  const opciones = ej.tipo === 'probabilistico' ? [...SUBTIPOS_PROB] : [...SUBTIPOS_NO_PROB];
  const opcionesShuffled = shuffleSeed(opciones, ej.id * 3571);

  area.innerHTML = `
    <div class="pregunta-card" style="margin-top:16px;animation:fadeInUp .4s ease">
      <div class="pregunta-text">Y exactamente, &iquest;qu&eacute; tipo de muestreo es?</div>
      <div class="pregunta-btns" style="flex-direction:column;align-items:stretch;max-width:400px;margin:0 auto">
        ${opcionesShuffled.map(op => `
          <button class="btn-respuesta" style="min-width:auto" onclick="responderP2('${op}')">
            ${op}
          </button>
        `).join('')}
      </div>
      <div id="feedback-p2"></div>
    </div>
  `;
  // Scroll al area
  area.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function responderP2(subtipoElegido){
  const ej = EJERCICIOS[state.ejercicioActual];
  const acierto = subtipoElegido === ej.subtipo;
  const btns = document.querySelectorAll('#feedback-area .btn-respuesta');
  btns.forEach(b => {
    b.disabled = true;
    if(b.textContent.trim() === ej.subtipo) b.classList.add('correct');
    if(b.textContent.trim() === subtipoElegido && !acierto) b.classList.add('wrong');
  });

  // Actualizar resultado
  const resultado = state.resultados[state.resultados.length - 1];
  resultado.p2Respuesta = subtipoElegido;
  resultado.p2Correcta = acierto;
  if(acierto){
    resultado.puntos = 15;
    state.puntaje += 10; // ya tenía 5 de P1, sumamos 10 más para llegar a 15
  } else {
    resultado.puntos = 5; // se queda con los 5 de P1
  }
  actualizarProgreso();

  const fb2 = document.getElementById('feedback-p2');
  fb2.innerHTML = `
    <div class="feedback-card ${acierto ? 'acierto' : 'error'}" style="animation:fadeInUp .4s ease">
      <div class="feedback-icon">${acierto ? '✅' : '❌'}</div>
      <div class="feedback-title" style="color:${acierto ? 'var(--accent)' : 'var(--error)'}">
        ${acierto ? 'Correcto' : 'No exactamente'}
      </div>
      <div class="feedback-text">${ej.explicacionP2}</div>
    </div>
    <div style="text-align:center">
      <button class="btn-siguiente" onclick="siguiente()">
        ${state.ejercicioActual < EJERCICIOS.length - 1 ? 'Siguiente ejercicio →' : 'Ver resultados'}
      </button>
    </div>
  `;
  fb2.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function mostrarFeedback(acierto, texto, fase){
  const area = document.getElementById('feedback-area');
  area.innerHTML = `
    <div class="feedback-card ${acierto ? 'acierto' : 'error'}" style="animation:fadeInUp .4s ease">
      <div class="feedback-icon">${acierto ? '✅' : '❌'}</div>
      <div class="feedback-title" style="color:${acierto ? 'var(--accent)' : 'var(--error)'}">
        ${acierto ? 'Correcto' : 'Incorrecto'}
      </div>
      <div class="feedback-text">${texto}</div>
    </div>
    <div style="text-align:center">
      <button class="btn-siguiente" onclick="siguiente()">
        ${state.ejercicioActual < EJERCICIOS.length - 1 ? 'Siguiente ejercicio →' : 'Ver resultados'}
      </button>
    </div>
  `;
  area.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function siguiente(){
  state.ejercicioActual++;
  if(state.ejercicioActual === 6){
    // Transición a Fase 2
    mostrarTransicion();
  } else if(state.ejercicioActual >= EJERCICIOS.length){
    mostrarPantallaFinal();
  } else {
