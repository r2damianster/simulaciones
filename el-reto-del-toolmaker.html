<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>El Reto del Toolmaker · Serious game para docentes</title>
<meta name="description" content="Serious game universitario: las apps genéricas siempre imponen límites; cuando el docente sabe especificar con claridad lo que necesita, puede crear con IA una herramienta propia y ajustarla.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A0%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  /* ===== Design tokens ===== */
  :root {
    --bg: #14110d;
    --card: #1d1914;
    --card-2: #221d16;
    --text: #ece6da;
    --muted: #b9b09e;
    --gold: #D4A24E;
    --gold-hi: #E8BC6A;
    --emerald: #34D399;
    --error: #e5604d;
    --border: rgba(236,230,218,0.10);
    --border-strong: rgba(236,230,218,0.22);
    --shadow: 0 8px 30px rgba(0,0,0,0.45);
    --sim-home-fg: #D4A24E;
    --sim-home-bg: rgba(212,162,78,.15);
    --sim-home-bd: rgba(212,162,78,.3);
    --sim-home-hi: #E8BC6A;
    --radius: 14px;
    --radius-sm: 8px;
    --t: 250ms ease;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Sans 3', system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.55;
    min-height: 100vh;
    padding: 70px 16px 80px;
    overflow-x: hidden;
  }
  h1, h2, h3, .title-font { font-family: 'Playfair Display', Georgia, serif; }

  /* ===== Fixed buttons ===== */
  .sim-home, .sim-lang {
    position: fixed;
    top: 14px;
    width: 40px; height: 40px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 10px;
    color: var(--sim-home-fg);
    background: var(--sim-home-bg);
    border: 1px solid var(--sim-home-bd);
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    z-index: 200;
    transition: all var(--t);
    cursor: pointer;
    font-family: 'Source Sans 3', sans-serif;
  }
  .sim-home { left: 14px; }
  .sim-lang { right: 14px; letter-spacing: .5px; }
  .sim-home:hover, .sim-lang:hover {
    color: var(--sim-home-hi);
    background: rgba(212,162,78,.25);
    border-color: var(--sim-home-hi);
  }
  .sim-home:focus-visible, .sim-lang:focus-visible {
    outline: 2px solid var(--gold-hi);
    outline-offset: 2px;
  }

  /* ===== Progress bar ===== */
  .progress-wrap { max-width: 920px; margin: 8px auto 24px; padding: 0 8px; }
  .progress-track { display: flex; align-items: center; gap: 8px; }
  .milestone {
    flex: 1;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding: 8px 6px;
    border-radius: 8px;
    border: 1px solid var(--border);
    transition: all var(--t);
  }
  .milestone.active { color: var(--gold); border-color: var(--gold); background: rgba(212,162,78,.08); }
  .milestone.done { color: var(--emerald); border-color: var(--emerald); background: rgba(52,211,153,.08); }

  /* ===== Layout ===== */
  .container { max-width: 920px; margin: 0 auto; }

  /* ===== Cards ===== */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card-title { font-size: 1.4rem; margin: 0 0 8px; color: var(--text); }
  .card-sub { color: var(--muted); font-size: 0.95rem; margin: 0 0 16px; }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex;
    align-items: center; justify-content: center;
    gap: 8px;
    min-height: 44px;
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--card-2);
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--t);
    text-decoration: none;
  }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  .btn:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
  .btn-primary { background: var(--gold); color: #1a1208; border-color: var(--gold); }
  .btn-primary:hover { background: var(--gold-hi); color: #1a1208; border-color: var(--gold-hi); }
  .btn-emerald { background: var(--emerald); color: #07251a; border-color: var(--emerald); }
  .btn-emerald:hover { background: #4ee6ac; color: #07251a; }
  .btn-ghost { background: transparent; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ===== Avatar ===== */
  .avatar-wrap { display: flex; gap: 14px; align-items: flex-start; margin: 16px 0; }
  .avatar-img {
    width: 64px; height: 64px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--gold);
    flex-shrink: 0;
    background: var(--card-2);
  }
  .avatar-fallback {
    width: 64px; height: 64px;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 32px;
    background: var(--card-2);
    border: 2px solid var(--gold);
    flex-shrink: 0;
  }
  .speech-bubble {
    background: var(--card-2);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 12px 16px;
    position: relative;
    flex: 1;
  }
  .speech-bubble::before {
    content: '';
    position: absolute;
    left: -7px; top: 16px;
    width: 12px; height: 12px;
    background: var(--card-2);
    border-left: 1px solid var(--border-strong);
    border-bottom: 1px solid var(--border-strong);
    transform: rotate(45deg);
  }
  .speech-name { font-weight: 700; color: var(--gold); font-size: .9rem; }
  .speech-text { color: var(--text); }

  /* ===== Chips ===== */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .chip {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--card-2);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: all var(--t);
    min-height: 36px;
    display: inline-flex; align-items: center; gap: 6px;
    font-family: inherit;
  }
  .chip:hover { border-color: var(--gold); }
  .chip.selected { background: rgba(212,162,78,.18); border-color: var(--gold); color: var(--gold-hi); }
  .chip:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }

  /* ===== App cards (phase 1) ===== */
  .app-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin: 12px 0;
  }
  .app-card {
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    cursor: pointer;
    transition: all var(--t);
    text-align: left;
    color: var(--text);
    font-family: inherit;
  }
  .app-card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .app-card.selected { border-color: var(--gold); background: rgba(212,162,78,.10); }
  .app-card.tried { opacity: .85; }
  .app-name { font-weight: 700; color: var(--gold); margin-bottom: 4px; }
  .app-desc { font-size: .85rem; color: var(--muted); }

  /* ===== Meters ===== */
  .meter {
    background: rgba(0,0,0,.3);
    border-radius: 999px;
    height: 10px;
    overflow: hidden;
    margin: 8px 0;
    border: 1px solid var(--border);
  }
  .meter-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--emerald), var(--gold), var(--error));
    transition: width 600ms ease;
    width: 0%;
  }
  .meter-label { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }

  /* ===== Mini interaction area ===== */
  .mini-area {
    background: rgba(0,0,0,.25);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 14px;
    min-height: 100px;
    margin: 10px 0;
  }
  .student-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .student-av {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--card-2);
    border: 1px solid var(--border-strong);
    font-size: 14px;
    animation: pop 300ms ease;
  }

  /* ===== Paywall ===== */
  .paywall {
    background: rgba(229,96,77,.12);
    border: 1px solid var(--error);
    border-radius: var(--radius-sm);
    padding: 12px;
    margin-top: 10px;
    text-align: center;
    animation: pop 350ms ease;
    color: var(--error);
    font-size: .9rem;
  }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* ===== Messages stream ===== */
  .msg-stream { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
  .msg-item {
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: .85rem;
    cursor: pointer;
    transition: all var(--t);
  }
  .msg-item:hover { border-color: var(--gold); }
  .msg-item.matched { opacity: .5; text-decoration: line-through; }

  /* ===== Form fields ===== */
  .field { margin-bottom: 14px; }
  .field-label { font-size: .9rem; color: var(--muted); margin-bottom: 6px; display: block; }
  .field-input {
    width: 100%;
    background: var(--card-2);
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 15px;
    margin-top: 6px;
  }
  .field-input:focus { outline: 2px solid var(--gold-hi); outline-offset: 0; border-color: var(--gold); }
  input[type="range"] { width: 100%; accent-color: var(--gold); }
  .slider-value { color: var(--gold); font-weight: 700; margin-left: 8px; }

  /* ===== Prompt preview ===== */
  .prompt-preview {
    background: #0f0c08;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 14px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    color: var(--emerald);
    white-space: pre-wrap;
    line-height: 1.6;
    min-height: 60px;
  }

  /* ===== Terminal ===== */
  .terminal {
    background: #0a0805;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 14px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    color: var(--emerald);
    min-height: 140px;
    margin: 12px 0;
  }
  .terminal-line { opacity: 0; animation: fadeIn .4s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }

  /* ===== Phone frame ===== */
  .phone-frame {
    background: #0a0805;
    border: 8px solid #2a241c;
    border-radius: 28px;
    max-width: 380px;
    margin: 16px auto;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .phone-bar {
    background: #1d1914;
    padding: 6px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .phone-content { background: #14110d; padding: 14px; min-height: 420px; }

  /* ===== In-app quiz ===== */
  .app-logo { text-align: center; font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--gold); margin-bottom: 10px; font-weight: 700; }
  .app-q { background: var(--card-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .app-q-text { font-weight: 600; margin-bottom: 8px; font-size: 14px; }
  .app-opt {
    display: block; width: 100%; text-align: left;
    background: var(--card);
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 4px;
    font-size: 13px;
    cursor: pointer;
    transition: all var(--t);
    font-family: inherit;
  }
  .app-opt:hover:not(:disabled) { border-color: var(--gold); }
  .app-opt.correct { background: rgba(52,211,153,.15); border-color: var(--emerald); color: var(--emerald); }
  .app-opt.wrong { background: rgba(229,96,77,.15); border-color: var(--error); color: var(--error); }
  .app-opt:disabled { cursor: default; }

  /* ===== Grade table ===== */
  .grade-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
  .grade-table th, .grade-table td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; }
  .grade-table th { background: var(--card-2); color: var(--gold); }
  .grade-table tr:nth-child(even) td { background: rgba(255,255,255,.02); }

  /* ===== Compare table ===== */
  .compare-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: .9rem; }
  .compare-table th, .compare-table td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
  .compare-table th { background: var(--card-2); color: var(--gold); }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    z-index: 500;
    padding: 20px;
    animation: fadeIn .3s forwards;
  }
  .modal-card {
    background: var(--card);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: var(--shadow);
  }

  /* ===== Badges ===== */
  .score-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(212,162,78,.12);
    color: var(--gold);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: .85rem;
    font-weight: 700;
    border: 1px solid var(--gold);
  }
  .ver-badge {
    display: inline-block;
    background: rgba(52,211,153,.15);
    color: var(--emerald);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: .75rem;
    font-weight: 700;
    margin-left: 6px;
  }

  /* ===== Diff block ===== */
  .diff-block {
    background: #0f0c08;
    border-left: 3px solid var(--emerald);
    padding: 8px 12px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: var(--emerald);
    margin: 8px 0;
    border-radius: 4px;
  }

  /* ===== Reflection ===== */
  .reflect-q {
    background: var(--card-2);
    border-left: 3px solid var(--gold);
    padding: 12px 16px;
    margin: 8px 0;
    border-radius: 4px;
    font-style: italic;
  }

  /* ===== Limits notice ===== */
  .limits-notice {
    background: rgba(229,96,77,.08);
    border: 1px solid rgba(229,96,77,.4);
    border-radius: var(--radius-sm);
    padding: 14px;
    margin: 12px 0;
  }

  /* ===== Responsive ===== */
  @media (max-width: 640px) {
    body { font-size: 16px; padding: 64px 12px 60px; }
    .card { padding: 16px; }
    .card-title { font-size: 1.15rem; }
    .avatar-img, .avatar-fallback { width: 48px; height: 48px; font-size: 24px; }
    .app-grid { grid-template-columns: 1fr; }
    .phone-frame { max-width: 100%; }
    .milestone { font-size: 10px; padding: 6px 4px; }
    .grid-2 { grid-template-columns: 1fr !important; }
  }

  /* ===== Reduced motion ===== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }

  /* ===== Utilities ===== */
  .hidden { display: none !important; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1; }
  .text-gold { color: var(--gold); }
  .text-emerald { color: var(--emerald); }
  .text-error { color: var(--error); }
  .text-muted { color: var(--muted); }
  .text-center { text-align: center; }
  .mt-12 { margin-top: 12px; }
  .mb-12 { margin-bottom: 12px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .screen { animation: screenIn 400ms ease; }
  @keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        /* === Guía de clase (preguntas para debatir) === */
        .sim-guide{position:fixed;top:50%;right:0;z-index:200;width:30px;height:84px;transform:translateY(-50%);
            display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
            color:var(--sim-home-fg,#888);background:var(--sim-home-bg,rgba(0,0,0,.35));
            border:1px solid var(--sim-home-bd,rgba(255,255,255,.15));border-right:none;border-radius:12px 0 0 12px;
            -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
            transition:width .2s,color .2s}
        .sim-guide:hover,.sim-guide:focus-visible,.sim-guide[aria-expanded="true"]{color:var(--sim-home-hi,#fff);width:36px}
        .sim-guide.is-pulsing{animation:guidePulse 1.6s ease-in-out 4}
        @keyframes guidePulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 7px var(--sim-home-bd,rgba(255,255,255,.2))}}
        .guide-panel{position:fixed;top:0;right:0;bottom:0;z-index:300;width:min(380px,100vw);
            display:flex;flex-direction:column;color:#e8e6e1;
            background:color-mix(in srgb,var(--sim-home-fg,#888) 9%,#0d0d0d);
            border-left:1px solid var(--sim-home-bd,rgba(255,255,255,.15));box-shadow:-12px 0 32px rgba(0,0,0,.5);
            transform:translateX(100%);visibility:hidden;transition:transform .3s ease,visibility 0s linear .3s}
        .guide-panel.is-open{transform:translateX(0);visibility:visible;transition:transform .3s ease}
        .guide-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 12px}
        .guide-title{font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--sim-home-fg,#fff);margin:0}
        .guide-actions{display:flex;gap:6px}
        .guide-close,.guide-popout{width:32px;height:32px;cursor:pointer;color:inherit;background:transparent;
            border:1px solid rgba(255,255,255,.18);border-radius:8px;font-size:14px}
        .guide-close:hover,.guide-close:focus-visible,.guide-popout:hover,.guide-popout:focus-visible{color:var(--sim-home-hi,#fff)}
        .guide-tabs{display:flex;gap:6px;padding:0 18px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
        .guide-tab{flex:1;padding:8px 6px;cursor:pointer;font:inherit;font-size:12px;color:inherit;
            background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:8px;opacity:.7}
        .guide-tab[aria-selected="true"]{opacity:1;color:var(--sim-home-hi,#fff);background:var(--sim-home-bg,rgba(255,255,255,.08));border-color:var(--sim-home-bd,rgba(255,255,255,.3))}
        .guide-questions{flex:1;overflow-y:auto;margin:0;padding:16px 18px 24px 38px;line-height:1.55;font-size:14px;text-align:left}
        .guide-questions li{margin-bottom:14px;padding-left:4px}
        .guide-questions li::marker{color:var(--sim-home-fg,#fff);font-weight:600}
        .guide-toast{position:fixed;left:50%;bottom:20px;z-index:250;transform:translate(-50%,16px);opacity:0;pointer-events:none;
            display:flex;align-items:center;gap:12px;max-width:min(520px,calc(100vw - 32px));padding:10px 14px;
            font-size:13px;line-height:1.4;color:#e8e6e1;border-radius:12px;
            background:color-mix(in srgb,var(--sim-home-fg,#888) 12%,#0d0d0d);
            border:1px solid var(--sim-home-bd,rgba(255,255,255,.2));box-shadow:0 8px 24px rgba(0,0,0,.45);
            transition:opacity .4s ease,transform .4s ease}
        .guide-toast.is-visible{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
        .guide-toast-open{flex-shrink:0;padding:6px 12px;cursor:pointer;font:inherit;font-size:12px;font-weight:600;
            color:var(--sim-home-hi,#fff);background:var(--sim-home-bg,rgba(255,255,255,.08));
            border:1px solid var(--sim-home-bd,rgba(255,255,255,.3));border-radius:8px}
        .guide-toast-dismiss{flex-shrink:0;width:24px;height:24px;cursor:pointer;color:inherit;opacity:.6;background:transparent;border:none;font-size:13px}
        @media (prefers-reduced-motion:reduce){.guide-panel,.guide-toast{transition:none}.sim-guide.is-pulsing{animation:none}}
</style>
</head>

function t(key, vars){
  let str = (I18N[LANG] && I18N[LANG][key]) || I18N.es[key] || key;
  if (vars) {
    for (const varKey in vars) {
      str = str.replace(new RegExp('\\{' + varKey + '\\}', 'g'), vars[varKey]);
    }
  }
  return str;
}

/* ============================================================
   Utilities
   ============================================================ */
function escapeHtml(text){
  return String(text).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

function sanitizeAppName(name){
  const firstWord = String(name || '').trim().split(/\s+/)[0] || t('name_default');
  const cleaned = firstWord.replace(/[^A-Za-z0-9-]/g, '').slice(0, 14);
  return cleaned || (LANG === 'es' ? 'Docente' : 'Teacher');
}

const mainElement = document.getElementById('main');

function setProgress(phase){
  document.querySelectorAll('.milestone').forEach(milestone => {
    const milestonePhase = parseInt(milestone.dataset.phase, 10);
    milestone.classList.remove('active', 'done');
    if (milestonePhase < phase) milestone.classList.add('done');
    else if (milestonePhase === phase) milestone.classList.add('active');
  });
}

function render(html){
  mainElement.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function avatarBubble(text){
  return `
    <div class="avatar-wrap" aria-live="polite">
      <img src="avatarProfeArturito.jpg" class="avatar-img" alt="Profe Arturito"
           onerror="this.outerHTML='<span class=\\'avatar-fallback\\' aria-hidden=\\'true\\'>🧑‍🏫</span>'">
      <div class="speech-bubble">
        <div class="speech-name">Profe Arturito</div>
        <div class="speech-text">${text}</div>
      </div>
    </div>
  `;
}

function obtenerNombreUsuario(callback){
  const stored = sessionStorage.getItem('nombreEstudianteSim');
  if (stored && stored.trim()) { callback(stored); return; }
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.innerHTML = `
    <div class="modal-card">
      <h2 class="card-title">${t('name_q')}</h2>
      <p class="card-sub">${t('name_note')}</p>
      <input type="text" class="field-input" id="nameInput" placeholder="${escapeHtml(t('name_ph'))}" maxlength="40" aria-label="${escapeHtml(t('name_q'))}">
      <button class="btn btn-primary mt-12" id="nameBtn" style="width:100%">${t('name_btn')}</button>
    </div>
  `;
  document.body.appendChild(overlay);
  const input = overlay.querySelector('#nameInput');
  input.focus();
  function confirmName(){
    let value = input.value.trim();
    if (!value) value = t('name_default');
    sessionStorage.setItem('nombreEstudianteSim', value);
    overlay.remove();
    callback(value);
  }
  overlay.querySelector('#nameBtn').addEventListener('click', confirmName);
  input.addEventListener('keydown', event => { if (event.key === 'Enter') confirmName(); });
}

/* ============================================================
   PHASE 1 — generic apps
   ============================================================ */
function startPhase1(){
  state.phase = 1;
  setProgress(1);
  state.phase1.challengeIndex = 0;
  state.phase1.scores = [0, 0, 0, 0];
  state.phase1.triedApps = [[false,false,false],[false,false,false],[false,false,false],[false,false,false]];
  state.phase1.selectedApps = [-1, -1, -1, -1];
  state.phase1.frustration = 0;
  state.phase1.miniState = {};
  renderChallenge();
}

function renderChallenge(){
  const challengeIndex = state.phase1.challengeIndex;
  const challenge = CHALLENGES[challengeIndex];
  const tried = state.phase1.triedApps[challengeIndex];

  const appsHtml = challenge.apps.map((app, appIndex) => `
    <button class="app-card ${tried[appIndex] ? 'tried' : ''} ${state.phase1.selectedApps[challengeIndex] === appIndex ? 'selected' : ''}"
            onclick="handleAppChoice(${challengeIndex}, ${appIndex})"
            aria-label="${escapeHtml(app.name)}: ${escapeHtml(app.desc)}">
      <div class="app-name">${escapeHtml(app.name)}</div>
      <div class="app-desc">${escapeHtml(app.desc)}</div>
    </button>
  `).join('');

  const isLast = challengeIndex === CHALLENGES.length - 1;

  render(`
    <div class="screen">
      <div class="card">
        <div class="row mb-12">
          <span class="score-badge"><i class="fa-solid ${challenge.icon}"></i> ${t('challenge')} ${challengeIndex + 1} ${t('of')} ${CHALLENGES.length}: ${escapeHtml(challenge.theme)}</span>
          <div class="spacer"></div>
          <span class="score-badge"><i class="fa-solid fa-coins"></i> ${t('points')}: ${state.phase1.scores[challengeIndex]}</span>
        </div>
        <p class="card-sub"><strong>${t('situation')}:</strong> ${escapeHtml(challenge.situation)}</p>
        <div class="app-grid">${appsHtml}</div>
        <div id="miniArea"></div>
        <div class="mt-12">
          <div class="meter-label"><span>${t('frustration')}</span><span>${state.phase1.frustration}/100</span></div>
          <div class="meter"><div class="meter-fill" style="width:${state.phase1.frustration}%"></div></div>
        </div>
        <div class="row mt-12">
          <div class="spacer"></div>
          <button class="btn ${isLast ? 'btn-emerald' : 'btn-primary'}"
                  onclick="nextChallenge()"
                  ${state.phase1.selectedApps[challengeIndex] === -1 ? 'disabled' : ''}>
            ${isLast ? t('finish_phase1') : t('next_challenge')} <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>
    </div>
  `);

  // Re-render mini interaction if an app was already selected
  if (state.phase1.selectedApps[challengeIndex] !== -1) {
    renderMiniInteraction(challenge, state.phase1.selectedApps[challengeIndex]);
  }
}

function handleAppChoice(challengeIndex, appIndex){
  const challenge = CHALLENGES[challengeIndex];
  const wasTried = state.phase1.triedApps[challengeIndex][appIndex];
  if (!wasTried) {
    state.phase1.triedApps[challengeIndex][appIndex] = true;
  }
  state.phase1.selectedApps[challengeIndex] = appIndex;

  // Scoring: base by app, minus penalty for extra tries
  const scoreMap = [10, 6, 3];
  const baseScore = scoreMap[appIndex];
  const triesCount = state.phase1.triedApps[challengeIndex].filter(Boolean).length;
  const penalty = Math.max(0, triesCount - 1);
  state.phase1.scores[challengeIndex] = Math.max(0, baseScore - penalty);

  // Frustration rises per attempt
  state.phase1.frustration = Math.min(100, state.phase1.frustration + 8);

  renderMiniInteraction(challenge, appIndex);
  renderChallenge();
}

function renderMiniInteraction(challenge, appIndex){
  const area = document.getElementById('miniArea');
  if (!area) return;
  let html = '<div class="mini-area">';
  const config = challenge.miniConfig;

  if (challenge.miniType === 'students') {
    // Add students one by one; on the 7th, KaPlay shows paywall
    const stateKey = 'students_' + state.phase1.challengeIndex;
    if (!state.phase1.miniState[stateKey]) {
      state.phase1.miniState[stateKey] = { count: 0, locked: false };
    }
    const miniState = state.phase1.miniState[stateKey];

    html += `<p class="text-muted">${t('students_label')}: <span id="studentCount">${miniState.count}</span> / ${config.total}</p>`;
    html += '<div class="student-row" id="studentRow">';
    for (let i = 0; i < miniState.count; i++) {
      html += `<span class="student-av">${getAvatarEmoji(i)}</span>`;
    }
    html += '</div>';

    if (miniState.locked && appIndex === 0) {
      html += `<div class="paywall"><i class="fa-solid fa-lock"></i> ${t('paywall_msg')}</div>`;
    } else if (appIndex === 1) {
      html += `<div class="paywall"><i class="fa-solid fa-eye-slash"></i> ${t('paywall_2')}</div>`;
    } else if (appIndex === 2) {
      html += `<div class="paywall"><i class="fa-solid fa-credit-card"></i> ${t('paywall_3')}</div>`;
    }

    if (!miniState.locked) {
      html += `<button class="btn btn-ghost mt-12" onclick="addStudent(${state.phase1.challengeIndex}, ${appIndex})"><i class="fa-solid fa-plus"></i> ${t('add_student')}</button>`;
    }
  } else if (challenge.miniType === 'messages') {
    const messages = [t('msg1'), t('msg2'), t('msg3'), t('msg4'), t('msg5')];
    html += `<p class="text-muted">${t('msg_instruction')}</p>`;
    html += `<p class="text-gold" id="assignedLabel">${t('assigned', { n: 0 })}</p>`;
    html += '<div class="msg-stream">';
    messages.forEach((message, messageIndex) => {
      html += `<div class="msg-item" onclick="assignMessage(this)">${escapeHtml(message)}</div>`;
    });
    html += '</div>';
    if (appIndex === 0) {
      html += `<div class="paywall"><i class="fa-solid fa-unlink"></i> ${t('limit_no_grades')}</div>`;
    } else if (appIndex === 1) {
      html += `<div class="paywall"><i class="fa-solid fa-message-slash"></i> ${t('paywall_2')}</div>`;
    } else {
      html += `<div class="paywall"><i class="fa-solid fa-lock"></i> ${t('paywall_3')}</div>`;
    }
  } else if (challenge.miniType === 'context') {
    html += `<p class="text-muted">${t('situation')}: Manta — puerto, pesca, turismo</p>`;
    html += `<div style="padding:10px;border:1px solid var(--border);border-radius:8px;margin:6px 0;">
      <div class="text-muted">📍 Plantilla: "Nueva York en invierno" <span class="text-error">(ajeno)</span></div>
      <div class="text-muted mt-12">✏️ Intento de cambiar a "Puerto de Manta"</div>
    </div>`;
    if (appIndex === 0) {
      html += `<div class="paywall"><i class="fa-solid fa-lock"></i> ${t('lock_msg')}</div>`;
    } else if (appIndex === 1) {
      html += `<div class="paywall"><i class="fa-solid fa-image"></i> ${t('lock_2')}</div>`;
    } else {
      html += `<div class="paywall"><i class="fa-solid fa-lock"></i> ${t('lock_3')}</div>`;
    }
  } else if (challenge.miniType === 'data') {
    const megabytes = appIndex === 0 ? 80 : (appIndex === 1 ? 25 : 5);
    html += `<div class="meter-label"><span>${t('data_meter')}</span><span>${megabytes} MB</span></div>`;
    html += `<div class="meter"><div class="meter-fill" style="width:${Math.min(100, megabytes)}%"></div></div>`;
    html += `<p class="text-muted mt-12">${t('data_collect')}:</p>`;
    const collectedData = appIndex === 0
      ? ['Ubicación', 'Cookies de terceros', 'Historial de video']
      : appIndex === 1
        ? ['Nombre completo', 'Correo', 'Teléfono', 'Ubicación', 'Datos de pago']
        : ['Solo progreso del quiz'];
    html += '<ul class="text-muted" style="margin:4px 0 0 18px;padding:0;font-size:.85rem;">';
    collectedData.forEach(item => { html += `<li>${escapeHtml(item)}</li>`; });
    html += '</ul>';
    if (appIndex === 2) {
      html += `<div class="paywall"><i class="fa-solid fa-chart-simple"></i> ${t('lock_3')}</div>`;
    }
  }
  html += '</div>';
  area.innerHTML = html;
}

function getAvatarEmoji(index){
  const emojis = ['🧑','👩','👨','👧','👦','🧒','👩‍🦱','👨‍🦱','👩‍🦰','👨‍🦰'];
  return emojis[index % emojis.length];
}

window.addStudent = function(challengeIndex, appIndex){
  const challenge = CHALLENGES[challengeIndex];
  const config = challenge.miniConfig;
  const stateKey = 'students_' + challengeIndex;
  if (!state.phase1.miniState[stateKey]) state.phase1.miniState[stateKey] = { count: 0, locked: false };
  const miniState = state.phase1.miniState[stateKey];
  if (miniState.locked) return;
  miniState.count++;
  // KaPlay: lock at limit (6)
  if (appIndex === 0 && miniState.count >= config.limit) {
    miniState.locked = true;
  }
  renderMiniInteraction(challenge, appIndex);
};

window.assignMessage = function(element){
  element.classList.add('matched');
  const matched = document.querySelectorAll('.msg-item.matched').length;
  const label = document.getElementById('assignedLabel');
  if (label) label.textContent = t('assigned', { n: matched });
};

function nextChallenge(){
  const challengeIndex = state.phase1.challengeIndex;
  if (challengeIndex < CHALLENGES.length - 1) {
    state.phase1.challengeIndex = challengeIndex + 1;
    renderChallenge();
  } else {
    finishPhase1();
  }
}

function finishPhase1(){
  // Tool-need fit: derived from points (max 40), range 30-45
  const totalScore = state.phase1.scores.reduce((acc, score) => acc + score, 0);
  const ajuste = Math.round(30 + (totalScore / 40) * 15);
  state.phase3.ajuste = ajuste;

  render(`
    <div class="screen">
      <div class="card">
        <h2 class="card-title">${t('phase1_summary_title')}</h2>
        ${avatarBubble(t('phase1_summary_text'))}
        <div class="mt-12">
          <div class="meter-label"><span>${t('ajuste_label')}</span><span id="ajusteNum">0/100</span></div>
          <div class="meter"><div class="meter-fill" id="ajusteBar" style="width:0%"></div></div>
        </div>
        <div class="row mt-12">
          <div class="spacer"></div>
          <button class="btn btn-primary" onclick="startPhase2()">${t('next_phase')} <i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </div>
    </div>
  `);
  // Animate the ajuste bar
  setTimeout(() => {
    const bar = document.getElementById('ajusteBar');
    const num = document.getElementById('ajusteNum');
    if (bar) bar.style.width = ajuste + '%';
    if (num) {
      let current = 0;
      const interval = setInterval(() => {
        current += 2;
        if (current >= ajuste) { current = ajuste; clearInterval(interval); }
        num.textContent = current + '/100';
      }, 30);
    }
  }, 200);
}

window.selectField = function(field, value){
  state.phase2[field] = value;
  renderPromptBuilder();
};

window.toggleNot = function(value){
  const notsArray = state.phase2.nots;
  const foundIndex = notsArray.indexOf(value);
  if (foundIndex >= 0) notsArray.splice(foundIndex, 1);
  else notsArray.push(value);
  renderPromptBuilder();
};

function buildPromptText(){
  const builder = state.phase2;
  const whatMap = { quiz: t('what_quiz'), notes: t('what_notes'), both: t('what_both') };
  const contextMap = { port: t('ctx_port'), fishing: t('ctx_fishing'), tourism: t('ctx_tourism'), none: t('ctx_none') };
  const langMap = { es: t('lang_es'), en: t('lang_en'), both: t('lang_both') };
  const what = builder.what ? whatMap[builder.what] : t('not_specified');
  const context = builder.context ? `, contexto: ${contextMap[builder.context]}` : '';
  const nots = builder.nots.length ? `, sin: ${builder.nots.map(key => t('not_' + key)).join(', ')}` : '';
  const lang = builder.lang ? langMap[builder.lang] : t('not_specified');
  return t('prompt_skeleton', { what, who: builder.who, context, nots, lang, name: state.safeName });
}

window.updatePromptPreview = function(){
  const element = document.getElementById('promptPreview');
  if (element) element.textContent = buildPromptText();
};

function computeSpecScore(){
  const builder = state.phase2;
  let score = 0;
  if (builder.what) score += 20;
  if (builder.context) score += 20;
  if (builder.nots.length > 0) score += 20;
  if (builder.lang) score += 20;
  score += 20; // who is always set
  // Penalties
  if (builder.nots.length === 0) score -= 10;
  // Contradiction: "no heavy data" + "both" (more features = more data)
  if (builder.nots.includes('data') && builder.what === 'both') score -= 15;
  return Math.max(0, Math.min(100, score));
}

window.updateSpecScore = function(){
  const score = computeSpecScore();
  state.phase2.specScore = score;
  const element = document.getElementById('specScore');
  if (element) element.textContent = score;
};

window.generateApp = function(){
  const score = computeSpecScore();
  state.phase2.specScore = score;
  if (score < 60) {
    renderRefinePrompt();
  } else {
    state.phase2.generated = true;
    runTerminalAnimation();
  }
};

function renderRefinePrompt(){
  render(`
    <div class="screen">

}

function runTerminalAnimation(){
  const lines = [
    t('terminal_analyzing'),
    t('terminal_iface'),
    t('terminal_grades'),
    t('terminal_name', { name: state.appName }),
    t('terminal_done')

  render(`
    <div class="screen">
      <div class="card">

        <div class="terminal" id="terminal"></div>
      </div>

  const terminal = document.getElementById('terminal');

      terminal.appendChild(div);
      if (lineIndex === lines.length - 1) {

}

window.toggleInAppLang = function(){
  inAppLang = inAppLang === 'es' ? 'en' : 'es';

    renderPhonePreview({
      autoGrade: applied.includes(0),

      bilingual: applied.includes(2),
      teams: applied.includes(3),
      version: state.phase3.version
    });
  }
};

function getQuizQuestions(contextualized){
  if (contextualized) {
    return [
      { question: t('question1'), options: [t('opt1_a'), t('opt1_b'), t('opt1_c')], correct: 0 },
      { question: t('question2'), options: [t('opt2_a'), t('opt2_b'), t('opt2_c')], correct: 0 },
      { question: t('question3'), options: [t('opt3_a'), t('opt3_b'), t('opt3_c')], correct: 0 }
    ];
  }
  return [
    { question: t('generic_q1'), options: [t('generic_opt1a'), t('generic_opt1b'), t('generic_opt1c')], correct: 1 },
    { question: t('generic_q2'), options: [t('generic_opt2a'), t('generic_opt2b'), t('generic_opt2c')], correct: 0 },
    { question: t('generic_q3'), options: [t('generic_opt3a'), t('generic_opt3b'), t('generic_opt3c')], correct: 1 }
  ];
}

function renderQuizQuestions(questions){
  return questions.map((question, questionIndex) => `
    <div class="app-q" data-question="${questionIndex}">
      <div class="app-q-text">${questionIndex + 1}. ${escapeHtml(question.question)}</div>
      ${question.options.map((option, optionIndex) => `
        <button class="app-opt" onclick="answerQuiz(${questionIndex}, ${optionIndex})"
                data-correct="${question.correct === optionIndex}">${escapeHtml(option)}</button>
      `).join('')}
    </div>
  `).join('');
}

window.answerQuiz = function(questionIndex, optionIndex){
  const block = document.querySelector(`.app-q[data-question="${questionIndex}"]`);
  if (!block) return;
  const buttons = block.querySelectorAll('.app-opt');
  buttons.forEach((button, buttonIndex) => {
    button.disabled = true;
    if (button.dataset.correct === 'true') button.classList.add('correct');
    else if (buttonIndex === optionIndex) button.classList.add('wrong');
  });
  // Update first grade row
  const firstRow = document.querySelector('.grade-table tbody tr');
  if (firstRow) {
    const isCorrect = buttons[optionIndex].dataset.correct === 'true';
    const cells = firstRow.querySelectorAll('td');
    const gradeCell = cells[cells.length - 1];
    gradeCell.textContent = isCorrect ? '10' : '5';
    if (cells.length >= 4) {
      const statusCell = cells[cells.length - 2];
      statusCell.textContent = isCorrect ? t('approved') : t('reinforce');
      statusCell.style.color = isCorrect ? 'var(--emerald)' : 'var(--error)';
    }
  }
};

function generateStudents(count){
  const namesEs = ['Ana','Luis','María','José','Carlos','Sofía','Pedro','Elena','Diego','Laura','Andrés','Carmen','Miguel','Lucía','Javier','Paula','Sergio','Isabel','David','Raquel','Pablo','Marta','Iván','Cristina','Marcos','Beatriz','Álvaro','Nuria','Hugo','Sara'];
  const namesEn = ['Anna','Luke','Mary','Joe','Charles','Sophie','Peter','Elena','James','Laura','Andrew','Carmen','Mike','Lucy','Jason','Paul','Steve','Isabel','David','Rachel','Paul','Martha','Ivan','Christine','Mark','Bea','Alvaro','Nuria','Hugo','Sara'];
  const names = LANG === 'es' ? namesEs : namesEn;
  const list = [];
  for (let i = 0; i < count; i++) {
    list.push(names[i % names.length] + (i >= names.length ? ' ' + (Math.floor(i / names.length) + 1) : ''));
  }
  return list;
}

function renderGradeRows(students, autoGrade){
  const rows = students.slice(0, Math.min(students.length, 10)).map((student, studentIndex) => `
    <tr>
      <td>${studentIndex + 1}</td>
      <td>${escapeHtml(student)}</td>
      ${autoGrade ? `<td>—</td>` : ''}
      <td>—</td>
    </tr>
  `).join('');
  const extra = students.length > 10
    ? `<tr><td colspan="${autoGrade ? 4 : 3}" class="text-muted text-center">… +${students.length - 10} ${t('students_label')}</td></tr>`
    : '';
  return rows + extra;
}

function renderAppliedView(targetAjuste){
  const diffMap = {
    0: '> add: auto_grading();  // score + status per student',
    1: '> add: context.localize("Manta");  // questions + emojis',

  };

  let contradiction = '';
  if (state.phase3.applied.includes(1) && (state.phase2.context === 'none' || !state.phase2.context)) {
    contradiction = avatarBubble(t('contradiction_warn'));
  } else if (state.phase3.applied.includes(2) && state.phase2.lang && state.phase2.lang !== 'both') {
    contradiction = avatarBubble(t('contradiction_warn'));

  render(`

  setTimeout(() => {

    if (num) {

}

  anchor.download = state.appName + '.html';

  URL.revokeObjectURL(url);
};

    questionsList.replaceChildren();
    guideQuestions[phaseKey].forEach(questionText => {
      const questionItem = document.createElement('li');
      questionItem.textContent = questionText;
      questionsList.appendChild(questionItem);
    });
    questionsList.scrollTop = 0;
  }

  guidePhases.forEach(phaseKey => {
    const tabButton = document.createElement('button');
    tabButton.type = 'button';
    tabButton.className = 'guide-tab';
    tabButton.setAttribute('role', 'tab');
    tabButton.dataset.phase = phaseKey;
    tabButton.textContent = guideUi[phaseKey];
    tabButton.addEventListener('click', () => showPhase(phaseKey));
    tabsContainer.appendChild(tabButton);
  });

  function setPanelOpen(isOpen){
    guidePanel.classList.toggle('is-open', isOpen);
    guideButton.setAttribute('aria-expanded', String(isOpen));
    if (isOpen) { hideToast(); closeButton.focus(); } else { guideButton.focus(); }
  }
  guideButton.addEventListener('click', () => setPanelOpen(!guidePanel.classList.contains('is-open')));
  closeButton.addEventListener('click', () => setPanelOpen(false));
  document.addEventListener('keydown', keyEvent => {
    if (keyEvent.key === 'Escape' && guidePanel.classList.contains('is-open')) setPanelOpen(false);
  });

  /* Abre la guía completa en una pestaña nueva (útil para proyectarla o tenerla aparte) */
  function openGuideInNewTab(){
    const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--sim-home-fg').trim() || '#10a37f';
    const escapeHtml = rawText => rawText.replace(/[&<>"]/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[character]));
    const sectionsHtml = guidePhases.map(phaseKey =>
      '<section><h2>' + escapeHtml(guideUi[phaseKey]) + '</h2><ol>' +
      guideQuestions[phaseKey].map(questionText => '<li>' + escapeHtml(questionText) + '</li>').join('') +
      '</ol></section>').join('');
    const simulationName = escapeHtml(document.title || '');
    const pageHtml = '<!doctype html><html lang="' + guideLang + '"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>' + simulationName + ' — ' + escapeHtml(guideUi.title) + '</title><style>' +
      ':root{--accent:' + accentColor + '}*{box-sizing:border-box}' +
      'body{margin:0;background:#0f0f0f;color:#e8e6e1;font:17px/1.6 Georgia,"Times New Roman",serif}' +
      'main{max-width:760px;margin:0 auto;padding:40px 24px 64px}' +
      'h1{margin:0 0 4px;font-size:28px;color:var(--accent)}.sim{margin:0 0 32px;opacity:.65;font-size:15px}' +
      'h2{margin:36px 0 12px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:6px}' +
      'ol{margin:0;padding-left:26px}li{margin-bottom:16px;padding-left:6px}li::marker{color:var(--accent);font-weight:700}' +
      '@media print{body{background:#fff;color:#111}h1,h2,li::marker{color:#111}}' +
      '</style></head><body><main><h1>' + escapeHtml(guideUi.title) + '</h1><p class="sim">' + simulationName + '</p>' +
      sectionsHtml + '</main></body></html>';
    const pageUrl = URL.createObjectURL(new Blob([pageHtml], { type: 'text/html;charset=utf-8' }));
    window.open(pageUrl, 'simlab_guide');
  }
  popoutButton.addEventListener('click', openGuideInNewTab);

  let toastTimer = null;
  function hideToast(){
    clearTimeout(toastTimer);
    guideToast.classList.remove('is-visible');
    guideButton.classList.remove('is-pulsing');
  }
  function announceCompletion(){
    if (guidePanel.classList.contains('is-open')) return;
    guideToast.replaceChildren();
    const toastText = document.createElement('span');
    toastText.textContent = guideUi.toast;
    const openButton = document.createElement('button');
    openButton.type = 'button';
    openButton.className = 'guide-toast-open';
    openButton.textContent = guideUi.toastOpen;
    openButton.addEventListener('click', () => { showPhase('after'); setPanelOpen(true); });
    const dismissButton = document.createElement('button');
    dismissButton.type = 'button';
    dismissButton.className = 'guide-toast-dismiss';
    dismissButton.setAttribute('aria-label', guideUi.close);
    dismissButton.textContent = '✕';
    dismissButton.addEventListener('click', hideToast);
    guideToast.append(toastText, openButton, dismissButton);
    guideToast.classList.add('is-visible');
    guideButton.classList.add('is-pulsing');
    toastTimer = setTimeout(hideToast, 20000);
  }

  /* Detecta el fin de la simulación sin tocar su lógica interna */
  try {
    const nativeSetItem = Storage.prototype.setItem;
    Storage.prototype.setItem = function(storageKey, storageValue){
      nativeSetItem.apply(this, arguments);
      if (this === window.localStorage && String(storageKey).indexOf('simlab_done_') === 0) {
        setTimeout(announceCompletion, 1500);
      }
    };
  } catch (storageError) { /* sin aviso automático; el botón sigue disponible */ }

  showPhase('before');
})();
</script>
</body>
</html>
