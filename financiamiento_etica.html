<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Enjambre de la Ciencia</title>
    <meta name="description" content="Simulación pedagógica interactiva de ética académica: navega entre revistas depredadoras, gestiona fondos ONU/CEDIA y toma decisiones éticas bajo presión. SimLab ULEAM.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Roboto:wght@300;700;900&display=swap');

        :root { --bg-dark: #05070a; --panel-bg: #0d1117; --text-main: #c9d1d9; --cyan: #00f3ff; --green: #238636; --yellow: #ffeb3b; --red: #ff3d5a; --sim-home-fg: #00f3ff; --sim-home-bg: rgba(0,243,255,0.1); --sim-home-bd: rgba(0,243,255,0.2); --sim-home-hi: #00ffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-dark); color: var(--text-main); font-family: 'Roboto', sans-serif; overflow: hidden; height: 100vh; display: flex; }
        
        /* LAYOUT SPLIT */
        #map-container { flex: 2; position: relative; border-right: 1px solid #21262d; }
        #canvas { width: 100%; height: 100%; display: block; background: #010409; }
        
        #terminal-container { flex: 1; display: flex; flex-direction: column; background: var(--panel-bg); }
        
        #terminal-header { padding: 10px 15px; border-bottom: 1px solid #21262d; font-family: 'Share Tech Mono', monospace; color: #484f58; display: flex; justify-content: space-between; font-size: 0.8rem; }
        
        #hud { padding: 15px; display: flex; gap: 15px; border-bottom: 1px solid #21262d; }
        .stat { flex: 1; background: #161b22; padding: 10px; border-radius: 4px; border: 1px solid #21262d; }
        .stat-label { font-size: 0.7rem; color: #484f58; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-family: 'Share Tech Mono', monospace; font-size: 1.2rem; color: var(--cyan); margin-top: 5px; }
        
        #log-area { flex: 1; padding: 15px; overflow-y: auto; font-family: 'Share Tech Mono', monospace; font-size: 0.85rem; line-height: 1.5; scrollbar-width: thin; scrollbar-color: #21262d var(--panel-bg); }
        .log-entry { margin-bottom: 8px; opacity: 0.9; animation: fadeIn 0.3s; }
        .log-sys { color: #484f58; }
        .log-onu { color: #58a6ff; }
        .log-a { color: #3fb950; font-style: italic; } /* Aburrido */
        .log-b { color: var(--yellow); font-weight: bold; }
        .log-warn { color: var(--red); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        #instructions { padding: 15px; border-top: 1px solid #21262d; background: #161b22; font-size: 0.8rem; color: #8b949e; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; }

        /* MODAL FINAL */
        #final-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; }
        .modal { background: var(--panel-bg); border: 1px solid var(--red); padding: 40px; max-width: 500px; text-align: center; }
        .modal h2 { color: var(--red); font-family: 'Share Tech Mono'; margin-bottom: 20px; }
        .score { font-size: 3em; font-family: 'Share Tech Mono'; margin: 20px 0; }
        .score-good { color: var(--cyan); text-shadow: 0 0 20px rgba(0,243,255,0.5); }
        .score-bad { color: var(--red); text-shadow: 0 0 20px rgba(255,61,90,0.5); }

        /* MODALES DE BRIEFING Y TENTACIÓN */
        #briefing-modal, #choice-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; }
        .modal-info { background: var(--panel-bg); border: 1px solid var(--cyan); padding: 30px; max-width: 480px; text-align: left; font-size: 0.9rem; line-height: 1.6; }
        .modal-info h2 { color: var(--cyan); font-family: 'Share Tech Mono'; margin-bottom: 15px; text-align:center; }
        .modal-temptation { background: #1a0d05; border: 1px solid var(--yellow); padding: 30px; max-width: 480px; text-align: left; font-size: 0.9rem; line-height: 1.6; box-shadow: 0 0 30px rgba(255,235,59,0.2); }
        .modal-temptation h2 { color: var(--yellow); font-family: 'Share Tech Mono'; margin-bottom: 15px; text-align:center; }
        .modal-btn-row { display:flex; gap:10px; margin-top:20px; }
        .modal-btn-row button { flex:1; padding: 12px; border:none; cursor:pointer; font-family:'Share Tech Mono'; font-weight:bold; }
        .btn-tempt { background: var(--yellow); color:#000; }
        .btn-honest { background: var(--green); color:#fff; }
        .btn-start { background: var(--cyan); color:#000; width:100%; padding:12px; border:none; cursor:pointer; font-family:'Share Tech Mono'; font-weight:bold; margin-top:15px; }
        .sim-home{position:fixed;top:14px;left:14px;z-index:200;width:40px;height:40px;
          display:flex;align-items:center;justify-content:center;text-decoration:none;
          color:var(--sim-home-fg);background:var(--sim-home-bg);
          border:1px solid var(--sim-home-bd);border-radius:10px;
          transition:transform .2s, color .2s}
        .sim-home:hover,.sim-home:focus-visible{color:var(--sim-home-hi);transform:scale(1.06)}
    </style>
</head>
<body>

    <a href="index.html" class="sim-home" title="Volver al inicio" aria-label="Volver al inicio del SimLab">
      <i class="fa-solid fa-house" aria-hidden="true"></i>
    </a>

    <div id="map-container">
        <canvas id="canvas"></canvas>
    </div>

    <div id="terminal-container">
        <div id="terminal-header">
            <span>TERMINAL_INVESTIGADOR // NODE_01</span>
            <span id="clock"></span>
        </div>
        <div id="hud">
            <div class="stat">
                <div class="stat-label">Financiamiento</div>
                <div class="stat-value" id="credits">0.00</div>
            </div>
            <div class="stat">
                <div class="stat-label">Prestigio</div>
                <div class="stat-value" id="prestige">0.00</div>
            </div>
            <div class="stat">
                <div class="stat-label">Estado</div>
                <div class="stat-value" id="status" style="font-size: 0.9rem; color: #8b949e;">EXPLORANDO</div>
            </div>
            <div class="stat" id="deadline-stat" style="display:none;">
                <div class="stat-label">Plazo Publicación</div>
                <div class="stat-value" id="deadline" style="color: var(--yellow);">--:--</div>
            </div>
        </div>
        <div id="log-area"></div>
        <div id="instructions">Haz clic en el mapa para mover a tu investigador hacia las zonas.</div>
    </div>

    <div id="final-modal">
        <div class="modal">
            <h2>SIMULACIÓN TERMINADA</h2>
            <div id="revelation-text" style="font-size: 0.9rem; line-height: 1.6; color: #ff8a9e; margin-bottom: 20px;"></div>
            <div class="score" id="final-score-text"></div>
            <div id="breakdown" style="text-align: left; font-size: 0.8rem; color: #8b949e; margin: 20px 0;"></div>
            <button style="background: var(--red); color: white; border: none; padding: 10px 20px; cursor: pointer; font-family: 'Share Tech Mono';" onclick="location.reload()">REINICIAR</button>
        </div>
    </div>

    <div id="briefing-modal">
        <div class="modal-info">
            <h2>📋 BRIEFING DE MISIÓN</h2>
            <div id="briefing-text"></div>
            <button class="btn-start" id="btnComenzar">COMENZAR SIMULACIÓN</button>
        </div>
    </div>

    <div id="choice-modal">
        <div class="modal-temptation" id="choice-box">
            <h2 id="choice-title"></h2>
            <div id="choice-text" style="margin-bottom:10px;"></div>
            <div class="modal-btn-row">
                <button class="btn-tempt" id="choice-accept"></button>
                <button class="btn-honest" id="choice-reject"></button>
            </div>
        </div>
    </div>

<script>
    // --- PERSONALIZACIÓN: NOMBRE DEL USUARIO ---
    // (solo en esta sesión del navegador, no se guarda permanentemente)
    function obtenerNombreUsuario(callback) {
        const guardado = sessionStorage.getItem('nombreEstudianteSim');
        if (guardado) { callback(guardado); return; }
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:99999;';
        overlay.innerHTML = `
            <div style="background:#1e2329;color:#e6edf3;padding:32px;border-radius:14px;max-width:380px;width:90%;text-align:center;border:1px solid #2f81f7;font-family:inherit;box-shadow:0 20px 60px rgba(0,0,0,.5)">
                <h3 style="margin:0 0 12px;color:#2f81f7">¿Cómo te llamas?</h3>
                <p style="font-size:.85rem;opacity:.8;margin:0 0 16px;line-height:1.5">Para personalizar tu resultado. Tu nombre solo se usa en esta sesión del navegador y no se guarda ni se envía a ningún servidor.</p>
                <input id="inputNombreUsuario" type="text" placeholder="Tu nombre" style="width:100%;padding:10px;border-radius:6px;border:1px solid #777;background:rgba(255,255,255,.05);color:inherit;margin-bottom:16px;box-sizing:border-box;font-size:1rem">
                <button id="btnConfirmarNombre" style="padding:10px 28px;border:none;border-radius:6px;background:#2f81f7;color:#fff;font-weight:700;cursor:pointer;font-size:1rem">Continuar</button>
            </div>`;
        document.body.appendChild(overlay);
        const input = overlay.querySelector('#inputNombreUsuario');
        input.focus();
        const confirmar = () => {
            const nombre = input.value.trim() || 'Estudiante';
            sessionStorage.setItem('nombreEstudianteSim', nombre);
            overlay.remove();
            callback(nombre);
        };
        overlay.querySelector('#btnConfirmarNombre').addEventListener('click', confirmar);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') confirmar(); });
    }

    // --- SETUP DEL CANVAS ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- ESTADO DEL JUEGO ---
    let state = {
        credits: 0, prestige: 0,
        phase: 1, // 1: ONU, 2: Lab/Auditoria, 3: Publicacion, 4: Fin
        timer: 30, // Segundos para ONU
        timerActive: false,
        inZone: null,
        choseTrap: false,
        sanctioned: false,
        rejectedByA: false,
        ended: false,
        started: false,   // true tras cerrar el briefing
        paused: false,    // true mientras hay un modal de elección abierto
        // --- TENTACIONES Y DEUDA ÉTICA ---
        plagio: false,        // T1: aceptó propuesta "fantasma" para la ONU
        dataFraud: false,     // T2: aceptó "ajustar" datos en el laboratorio
        offeredONU: false,
        offeredLab: false,
        // --- VENTANA DE PUBLICACIÓN (FASE 3) ---
        pubTimer: 120,        // 2 minutos totales para publicar
        pubTimerActive: false,
        enteredQ1Early: false, // entró a Q1 dentro del primer minuto
        publishedFast: false,  // publicó en FAST PUBLISH
        temptedFast: false     // ya recibió la oferta del tentador en FAST PUBLISH
    };

    // --- DEFINICIÓN DE ZONAS (Porcentaje del canvas para que sea responsive) ---
    const zones = [
        { id: 'onu', name: 'CONVOCATORIA ONU', icon: '🇺🇳', x: 0.05, y: 0.05, w: 0.4, h: 0.4, color: '#0d2240', borderColor: '#58a6ff', slow: 1 },
        { id: 'lab', name: 'LABORATORIO', icon: '🧪', x: 0.05, y: 0.55, w: 0.4, h: 0.4, color: '#0d1117', borderColor: '#484f58', slow: 1 },
        { id: 'revistaA', name: 'REVISTA Q1 (Peer Review)', icon: '📗', x: 0.55, y: 0.55, w: 0.4, h: 0.4, color: '#0a1f0a', borderColor: '#238636', slow: 0.3 }, // Zona LENTA
        { id: 'revistaB', name: '⚡ FAST PUBLISH ⚡', icon: '💸', x: 0.55, y: 0.05, w: 0.4, h: 0.4, color: '#2a2200', borderColor: '#ffeb3b', slow: 2 } // Zona RÁPIDA
    ];

    function getZoneRect(z) {
        return { x: z.x * canvas.width, y: z.y * canvas.height, w: z.w * canvas.width, h: z.h * canvas.height };
    }

    // --- ENTIDADES (PLAYER Y NPCS) ---
    class Entity {
        constructor(x, y, isPlayer = false) {
            this.x = x; this.y = y;
            this.targetX = x; this.targetY = y;
            this.isPlayer = isPlayer;
            this.baseSpeed = isPlayer ? 3 : 1.5;
            this.speed = this.baseSpeed;
            this.radius = isPlayer ? 8 : 5;
            this.state = 'idle'; // idle, moving, trapped, success
            this.currentZone = null;
            this.waitTime = 0;
        }

        update() {
            if (!state.started || state.paused) return;
            // Verificar zona actual
            let inNewZone = null;
            for (let z of zones) {
                let r = getZoneRect(z);
                if (this.x > r.x && this.x < r.x + r.w && this.y > r.y && this.y < r.y + r.h) {
                    inNewZone = z.id;
                    this.speed = this.baseSpeed * z.slow; // Efecto de ralentización/velocidad
                    break;
                }
            }
            
            if (inNewZone !== this.currentZone) {
                this.currentZone = inNewZone;
                if (this.isPlayer) onPlayerEnterZone(inNewZone);
            }

            // Movimiento
            if (this.waitTime > 0) {
                this.waitTime--;
                return;
            }

            let dx = this.targetX - this.x;
            let dy = this.targetY - this.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if (dist > 5) {
                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
                this.state = 'moving';
            } else {
                this.state = 'idle';
                if (!this.isPlayer) this.npcThink();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            
            if (this.isPlayer) {
                ctx.fillStyle = '#00f3ff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00f3ff';
            } else if (this.state === 'trapped') {
                ctx.fillStyle = '#ffeb3b';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffeb3b';
            } else if (this.state === 'success') {
                ctx.fillStyle = '#3fb950';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#3fb950';
            } else {
                ctx.fillStyle = '#484f58';
                ctx.shadowBlur = 0;
            }
            ctx.fill();
            ctx.shadowBlur = 0;

            if (this.isPlayer) {
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🧑‍🔬', this.x, this.y - 1);
                ctx.textBaseline = 'alphabetic';
            }
        }

        npcThink() {
            if (state.ended) return;
            // IA estúpida: mucha probabilidad de ir a la trampa por la velocidad
            let rand = Math.random();
            if (rand < 0.6) { // 60% va a la trampa
                let r = getZoneRect(zones[3]);
                this.targetX = r.x + Math.random() * r.w;
                this.targetY = r.y + Math.random() * r.h;
            } else if (rand < 0.8) { // 20% va a la buena
                let r = getZoneRect(zones[2]);
                this.targetX = r.x + Math.random() * r.w;
                this.targetY = r.y + Math.random() * r.h;
            } else { // 20% da vueltas
                this.targetX = Math.random() * canvas.width;
                this.targetY = Math.random() * canvas.height;
            }
        }
    }

    // Iniciar jugador en el centro
    const player = new Entity(canvas.width / 2, canvas.height / 2, true);
    
    // Iniciar 15 NPCs dispersos
    const npcs = [];
    for(let i=0; i<15; i++) {
        npcs.push(new Entity(Math.random() * canvas.width, Math.random() * canvas.height));
    }

    // Tentador: NPC especial que aparece en Fase 3 cerca de FAST PUBLISH
    let tempter = null;

    // Control del ratón
    canvas.addEventListener('click', (e) => {
        if (state.ended || !state.started || state.paused) return;
        const rect = canvas.getBoundingClientRect();
        player.targetX = e.clientX - rect.left;
        player.targetY = e.clientY - rect.top;
    });

    // --- LÓGICA DE INTERFAZ ---
    const dom = {
        credits: document.getElementById('credits'),
        prestige: document.getElementById('prestige'),
        status: document.getElementById('status'),
        log: document.getElementById('log-area'),
        instructions: document.getElementById('instructions'),
        deadline: document.getElementById('deadline'),
        deadlineStat: document.getElementById('deadline-stat')
    };

    function updateHUD() {
        dom.credits.textContent = state.credits.toFixed(2);
        dom.prestige.textContent = state.prestige.toFixed(2);
    }

    function updateDeadlineDisplay() {
        const m = Math.floor(state.pubTimer / 60);
        const s = state.pubTimer % 60;
        dom.deadline.textContent = `${m}:${s.toString().padStart(2,'0')}`;
        dom.deadline.style.color = state.pubTimer <= 20 ? 'var(--red)' : 'var(--yellow)';
    }

    function log(text, type = 'sys') {
        const div = document.createElement('div');
        div.className = `log-entry log-${type}`;
        div.innerHTML = text;
        dom.log.appendChild(div);
        dom.log.scrollTop = dom.log.scrollHeight;
    }

    function setInstructions(text) { dom.instructions.innerHTML = text; }

    // --- MODAL DE ELECCIÓN (TENTACIONES) ---
    function showChoiceModal({ title, text, acceptLabel, rejectLabel, onAccept, onReject }) {
        state.paused = true;
        const modal = document.getElementById('choice-modal');
        document.getElementById('choice-title').textContent = title;
        document.getElementById('choice-text').innerHTML = text;
        const btnA = document.getElementById('choice-accept');
        const btnR = document.getElementById('choice-reject');
        btnA.textContent = acceptLabel;
        btnR.textContent = rejectLabel;
        modal.style.display = 'flex';

        const cleanup = () => {
            modal.style.display = 'none';
            state.paused = false;
            btnA.replaceWith(btnA.cloneNode(true));
            btnR.replaceWith(btnR.cloneNode(true));
        };
        document.getElementById('choice-accept').addEventListener('click', () => { cleanup(); onAccept(); });
        document.getElementById('choice-reject').addEventListener('click', () => { cleanup(); onReject(); });
    }

    // --- BRIEFING INICIAL ---
    function showBriefing(nombre) {
        const modal = document.getElementById('briefing-modal');
        document.getElementById('briefing-text').innerHTML = `
            <p>Bienvenido/a, <strong>${nombre}</strong>. Eres un/a investigador/a junior con la tesis a medio camino y el presupuesto del laboratorio agotado.</p>
            <p style="margin-top:10px;">Tu objetivo: conseguir financiamiento, producir evidencia y publicar tus resultados en una <strong>revista indexada legítima</strong>.</p>
            <p style="margin-top:10px;">Durante el camino recibirás <strong style="color:var(--yellow)">ofertas tentadoras</strong> que prometen atajos. Cada una tiene un costo ético, visible o invisible.</p>
            <p style="margin-top:10px;">Mueve a tu personaje haciendo clic en el mapa. Presta atención a los avisos del terminal: el reloj no se detiene.</p>
        `;
        modal.style.display = 'flex';
        document.getElementById('btnComenzar').addEventListener('click', () => {
            modal.style.display = 'none';
            state.started = true;
            log('> SISTEMA DE GESTIÓN DE INVESTIGACIÓN INICIADO.', 'sys');
            log('> AVISO: La convocatoria de la ONU está abierta. Diríjase a la zona azul.', 'onu');
            // Forzar transición a fase 3 si llega a fase 2 sin elegir
            setTimeout(() => {
                if (state.phase === 2 && !state.choseTrap && !state.ended) {
                    advanceToPhase3();
                }
            }, 15000);
        }, { once: true });
    }

    // --- LÓGICA DE ZONAS (TRIGGERS) ---
    let onuTimerInterval;
    
    function onPlayerEnterZone(zoneId) {
        if (zoneId === null) {
            if(state.phase === 1 && state.timerActive) setInstructions('<span style="color:#ff3d5a">⚠️ ADVERTENCIA: FUERA DE LA ZONA DE CONVOCATORIA. EL TIEMPO SIGUE CORRIENDO.</span>');
            return;
        }

        if (zoneId === 'onu' && state.phase === 1) {
            if (!state.timerActive) {
                state.timerActive = true;
                log('> CONVOCATORIA INICIADA. TIENE 30 SEGUNDOS PARA MANTENERSE EN LA ZONA Y REDACTAR.', 'onu');
                setInstructions('Manténgase dentro del cuadro azul. No se salga.');
                startOnuTimer();
                offerGhostwriter();
            } else {
                setInstructions('Redactando propuesta... Tiempo restante: ' + state.timer + 's');
            }
        }

        if (zoneId === 'lab' && state.phase === 2) {
            triggerLab();
        }

        if (state.phase === 3) {
            if (zoneId === 'revistaB') triggerFastPublishOffer();
            if (zoneId === 'revistaA') triggerQ1Entry();
        }
    }

    function startOnuTimer() {
        onuTimerInterval = setInterval(() => {
            if (state.paused || state.ended) return;
            state.timer--;
            if (state.timer <= 0) {
                clearInterval(onuTimerInterval);
                if (state.phase === 1) failONU();
            }
        }, 1000);
    }

    function failONU() {
        log('> ERROR: TIEMPO AGOTADO O ABANDONO DE ZONA. CONVOCATORIA CERRADA.', 'warn');
        setInstructions('Has fallado.');
        endGame(false, "Abandonó la convocatoria de la ONU. En la ciencia real, las oportunidades de financiamiento no esperan a que te decidas.");
    }

    function successONU() {
        clearInterval(onuTimerInterval);
        state.credits += 3;
        state.phase = 2;
        updateHUD();
        dom.status.textContent = 'FINANCIADO';
        dom.status.style.color = '#3fb950';
        log('> PROPUESTA ACEPTADA. +3.00 CRÉDITOS DEPOSITADOS.', 'onu');
        log('> FASE 2: VAYA AL LABORATORIO O BUSQUE DÓNDE PUBLICAR.', 'sys');
        setInstructions('Investigue en el Laboratorio (abajo izquierda) o busque publicar (derecha).');
        // Avanza a fase 3 a los 15s si no eligió aún
        setTimeout(() => {
            if (state.phase === 2 && !state.ended) advanceToPhase3();
        }, 15000);
    }

    // --- T1: oferta de "consultor académico" (plagio / propuesta fantasma) ---
    function offerGhostwriter() {
        if (state.offeredONU) return;
        state.offeredONU = true;
        setTimeout(() => {
            if (state.ended || state.phase !== 1) return;
            showChoiceModal({
                title: '📩 Mensaje cifrado recibido',
                text: `Un "consultor académico" te escribe:<br><em>"Te redacto la propuesta completa en 5 minutos. Ya fue aprobada en 3 convocatorias similares, solo con cambios cosméticos. Cobro el 15% de tu financiamiento si ganas."</em><br><br>¿Aceptas el atajo?`,
                acceptLabel: 'Aceptar atajo',
                rejectLabel: 'Redactar yo mismo',
                onAccept: () => {
                    state.plagio = true;
                    log('> Aceptaste una propuesta "fantasma" preescrita por un tercero.', 'b');
                    successONU();
                },
                onReject: () => {
                    state.prestige += 5;
                    updateHUD();
                    log('> Decides redactar tu propia propuesta. Más esfuerzo, pero es tuya.', 'a');
                }
            });
        }, 2000);
    }

    function triggerLab() {
        if (state.phase !== 2) return;
        log('> Ejecutando análisis de datos en laboratorio...', 'sys');
        // Simular auditoría aleatoria
        if (Math.random() > 0.7) {
            log('> ¡ALERTA! AUDITORÍA DE LA ONU EN CURSO. NO SE MUEVA A REVISTAS DUDOSAS.', 'warn');
        }
        offerDataFraud();
    }

    // --- T2: oferta de "ajustar" datos (manipulación de resultados) ---
    function offerDataFraud() {
        if (state.offeredLab) return;
        state.offeredLab = true;
        setTimeout(() => {
            if (state.ended || state.phase < 2) return;
            showChoiceModal({
                title: '🧪 Tu asistente te susurra',
                text: `<em>"Los datos no dan significancia... pero si ajustamos estos 3 valores atípicos, el p-valor baja de .08 a .03. Nadie revisa los datos crudos."</em><br><br>¿Ajustas los datos?`,
                acceptLabel: 'Ajustar datos',
                rejectLabel: 'Reportar datos reales',
                onAccept: () => {
                    state.dataFraud = true;
                    state.prestige += 15;
                    updateHUD();
                    log('> Datos "ajustados". Los resultados ahora son significativos... en apariencia.', 'b');
                },
                onReject: () => {
                    state.prestige += 10;
                    updateHUD();
                    log('> Reportas los resultados reales, incluido el hallazgo no significativo.', 'a');
                }
            });
        }, 1500);
    }

    // --- FASE 3: ventana de publicación de 2 minutos ---
    let pubTimerInterval;

    function advanceToPhase3() {
        if (state.phase >= 3 || state.ended) return;
        state.phase = 3;
        log('> FASE 3: MANUSCRITO LISTO. TIENES 2 MINUTOS PARA PUBLICAR.', 'sys');
        log('> Q1 (verde) solo acepta manuscritos en su primera ronda durante el primer minuto. FAST PUBLISH (amarillo) publica al instante, cuando sea.', 'sys');
        setInstructions('Plazo de 2:00. Verde = revisión Q1 (entra en el primer minuto). Amarillo = FAST PUBLISH (instantáneo, riesgoso).');
        dom.status.textContent = 'PLAZO ACTIVO';
        dom.status.style.color = '#d29922';
        dom.deadlineStat.style.display = '';
        startPubTimer();
        spawnTempter();
    }

    function startPubTimer() {
        state.pubTimerActive = true;
        updateDeadlineDisplay();
        pubTimerInterval = setInterval(() => {
            if (state.paused || state.ended) return;
            state.pubTimer--;
            updateDeadlineDisplay();
            if (state.pubTimer === 60) {
                log('> [NOTICIA DEL SISTEMA] La primera ronda de revisión de Q1 está por cerrar.', 'warn');
            }
            if (state.pubTimer <= 0) {
                clearInterval(pubTimerInterval);
                resolvePhase3();
            }
        }, 1000);
    }

    function spawnTempter() {
        let r = getZoneRect(zones[3]); // FAST PUBLISH
        tempter = { x: r.x + r.w / 2, y: r.y + r.h / 2, active: true };
    }

    function triggerQ1Entry() {
        if (state.enteredQ1Early || state.publishedFast || state.ended) return;
        if (state.pubTimer >= 60) {
            state.enteredQ1Early = true;
            log('> Manuscrito enviado a Revista Q1. Entró en cola de primera revisión.', 'a');
            log('> (Proceso riguroso: espera el veredicto de la ONU al cierre del plazo.)', 'a');
            setInstructions('Manuscrito en revisión Q1. Espera el cierre del plazo de publicación.');
        } else {
            log('> Llegaste a Q1, pero la primera ronda de revisión ya cerró (pasó el primer minuto).', 'warn');
            setInstructions('Q1 ya cerró su primera ronda. El plazo sigue corriendo.');
        }
    }

    // --- T3: el tentador ofrece FAST PUBLISH ---
    function triggerFastPublishOffer() {
        if (state.publishedFast || state.enteredQ1Early || state.ended || state.temptedFast) return;
        state.temptedFast = true;
        showChoiceModal({
            title: '😈 Un colega se acerca sonriendo',
            text: `<em>"¿Para qué esperar meses de revisión por pares? A mí esta revista me publicó ayer. Sin revisores, sin demoras... solo necesitas tu tarjeta."</em><br><br>¿Publicas en FAST PUBLISH ahora mismo?`,
            acceptLabel: 'Publicar ya',
            rejectLabel: 'Rechazar la oferta',
            onAccept: () => {
                state.publishedFast = true;
                state.choseTrap = true;
                state.credits -= 2;
                updateHUD();
                dom.status.textContent = 'PUBLICADO (FAST)';
                dom.status.style.color = '#ffeb3b';
                log('> ⚡ CONEXIÓN A FAST PUBLISH ESTABLECIDA.', 'b');
                log('> Publicación procesada en 0.1 segundos. -2.00 créditos.', 'b');
                log('> FIRMASTE DIGITALMENTE CLÁUSULA DE CONFIDENCIALIDAD.', 'b');
                log('> La ONU revisará tu rendición de cuentas al cierre del plazo.', 'sys');
                if (tempter) tempter.active = false;
            },
            onReject: () => {
                state.prestige += 5;
                updateHUD();
                log('> Le agradeces pero declinas. Se aleja decepcionado.', 'a');
                if (tempter) tempter.active = false;
            }
        });
    }

    // --- VEREDICTO FINAL DE LA ONU AL CERRAR EL PLAZO ---
    function resolvePhase3() {
        if (state.ended) return;
        state.phase = 4;
        dom.deadlineStat.style.display = 'none';

        if (state.publishedFast) {
            dom.status.textContent = 'AUDITORÍA ONU';
            dom.status.style.color = '#ff3d5a';
            log('> [NOTICIA DEL SISTEMA] La ONU solicita rendición de cuentas: ¿en qué revista publicaste?', 'warn');
            setTimeout(() => {
                state.sanctioned = true;
                state.prestige -= 50;
                updateHUD();
                log('> [NOTICIA DEL SISTEMA] SANCIÓN PÚBLICA: tu grupo ha sido vetado por mal uso de fondos. -50 Prestigio.', 'warn');
                endGame(false, "Publicaste en una revista depredadora para ganar tiempo. Cuando la ONU pidió cuentas, el engaño quedó expuesto y perdiste tu reputación científica.");
            }, 2500);
        } else if (state.enteredQ1Early) {
            dom.status.textContent = 'EN REVISIÓN...';
            dom.status.style.color = '#3fb950';
            log('> [NOTICIA DEL SISTEMA] La ONU revisa tu expediente: manuscrito en revisión por pares en Q1.', 'onu');
            setTimeout(() => {
                log('> [NOTICIA DEL SISTEMA] La ONU te FELICITA por seguir el proceso editorial correcto.', 'onu');
            }, 1500);
            setTimeout(() => {
                state.prestige += 100;
                updateHUD();
                log('> REVISIÓN COMPLETADA: "Su artículo requiere correcciones menores, pero el rigor es excelente."', 'a');
                log('> ¡PUBLICACIÓN ACEPTADA EN REVISTA Q1! +100 PRESTIGIO.', 'a');
                endGame(true, "Resististe la tentación del atajo, completaste el proceso editorial de la Revista Q1 y obtuviste una publicación legítima.");
            }, 3500);
        } else {
            dom.status.textContent = 'PLAZO VENCIDO';
            dom.status.style.color = '#ff3d5a';
            log('> ERROR: el plazo expiró sin publicación. El financiamiento se reasigna a otro equipo.', 'warn');
            endGame(false, "El plazo de publicación expiró. Ni te arriesgaste con FAST PUBLISH ni llegaste a tiempo a la revisión de Q1: tu investigación quedó sin publicar.");
        }
    }

    function endGame(win, msg) {
        if(state.ended) return;
        state.ended = true;
        clearInterval(onuTimerInterval);
        clearInterval(pubTimerInterval);

        localStorage.setItem('simlab_fin', Date.now());
        obtenerNombreUsuario(nombre => {
            document.getElementById('final-modal').style.display = 'flex';

            let ethicsNote = '';
            if (state.plagio || state.dataFraud) {
                ethicsNote = `<br><br><span style="color:var(--yellow)">Nota: aunque el resultado fue "${win ? 'exitoso' : 'fallido'}", aceptaste atajos que dejan una deuda ética en tu carrera.</span>`;
            }
            document.getElementById('revelation-text').innerHTML = `${nombre}, ${msg}${ethicsNote}`;

            let scoreClass = win ? 'score-good' : 'score-bad';
            document.getElementById('final-score-text').innerHTML = `<span class="${scoreClass}">${state.prestige.toFixed(2)} PTS</span>`;

            document.getElementById('breakdown').innerHTML = `
                Créditos restantes: ${state.credits.toFixed(2)}<br>
                Publicación Q1 (+100): ${state.enteredQ1Early && !state.publishedFast ? 'SÍ' : 'NO'}<br>
                Publicó en FAST PUBLISH: ${state.publishedFast ? 'SÍ' : 'NO'}<br>
                Sanción ONU (-50): ${state.sanctioned ? 'SÍ' : 'NO'}<br>
                Propuesta "fantasma" (plagio): ${state.plagio ? 'SÍ' : 'NO'}<br>
                Datos "ajustados" (fraude): ${state.dataFraud ? 'SÍ' : 'NO'}
            `;
        });
    }

    // --- GAME LOOP PRINCIPAL ---
    let frameCount = 0;

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Dibujar Grid de fondo
        ctx.strokeStyle = '#21262d';
        ctx.lineWidth = 1;
        for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
        for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }

        // Dibujar Zonas
        for (let z of zones) {
            let r = getZoneRect(z);
            ctx.fillStyle = z.color;
            ctx.fillRect(r.x, r.y, r.w, r.h);
            ctx.strokeStyle = z.borderColor;
            ctx.lineWidth = 2;
            ctx.strokeRect(r.x, r.y, r.w, r.h);

            // Efecto Neón especial para Revista B (La trampa)
            if (z.id === 'revistaB') {
                ctx.shadowBlur = 20 + Math.sin(frameCount * 0.1) * 10;
                ctx.shadowColor = '#ffeb3b';
                ctx.strokeRect(r.x, r.y, r.w, r.h);
                ctx.shadowBlur = 0;
            }

            // Texto de zona
            ctx.fillStyle = z.borderColor;
            ctx.font = '14px "Share Tech Mono"';
            ctx.textAlign = 'center';
            ctx.fillText(z.name, r.x + r.w/2, r.y + 20);

            // Icono de zona
            ctx.font = '46px sans-serif';
            ctx.fillText(z.icon, r.x + r.w/2, r.y + r.h/2 + 16);
        }

        // Tentador (NPC especial, fase 3, zona FAST PUBLISH)
        if (tempter && tempter.active) {
            ctx.font = '32px sans-serif';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 12 + Math.sin(frameCount * 0.2) * 6;
            ctx.shadowColor = '#ff3d5a';
            ctx.fillText('😈', tempter.x, tempter.y);
            ctx.shadowBlur = 0;
        }

        // Actualizar y dibujar NPCs
        for (let npc of npcs) {
            npc.update();
            
            // Lógica de comportamiento visual de NPCs
            if (npc.currentZone === 'revistaB' && npc.state !== 'trapped') {
                npc.state = 'trapped';
                log('> Un compañero investigador publicó rápidamente en FAST PUBLISH.', 'b');
            }
            
            npc.draw();
        }

        // Actualizar y dibujar Player
        player.update();
        player.draw();

        // Tentador: se acerca al jugador en Fase 3
        if (tempter && tempter.active && state.started && !state.paused) {
            let dx = player.x - tempter.x, dy = player.y - tempter.y;
            let dist = Math.hypot(dx, dy);
            if (dist > 25) {
                tempter.x += (dx / dist) * 1.2;
                tempter.y += (dy / dist) * 1.2;
            }
        }

        // Check de éxito ONU (si pasa 3 segundos dentro de la zona sin salir)
        if (state.started && !state.paused && state.phase === 1 && state.timerActive && player.currentZone === 'onu' && state.timer < 27) {
             successONU();
        }

        frameCount++;
        requestAnimationFrame(gameLoop);
    }

    // Reloj
    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);

    // Inicio
    gameLoop();
    obtenerNombreUsuario(nombre => {
        state.userName = nombre;
        showBriefing(nombre);
    });

</script>
