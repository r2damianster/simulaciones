<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Dilema del Investigador - ¿Dónde publicar?</title>
    <meta name="description" content="Simulación pedagógica de ética académica: consigue fondos, analiza tus datos y decide dónde publicar. Aprende a reconocer plagio, manipulación de datos y revistas depredadoras sin saber nada de investigación. SimLab ULEAM.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9C%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #14110d; --panel-bg: #1d1812; --panel-alt: #241f18; --line: #332c22;
            --text-main: #e3d9c4; --text-dim: #a89878; --cyan: #7ba7c9; --gold: #D4A24E;
            --green: #4a8f5f; --yellow: #d9a441; --red: #d86a6a;
            --sim-home-fg: #D4A24E; --sim-home-bg: rgba(212,162,78,0.12); --sim-home-bd: rgba(212,162,78,0.28); --sim-home-hi: #fbbf24;
            /* alias del modal de nombre */
            --card: var(--panel-bg); --txt: var(--text-main); --txt-3: var(--text-dim); --accent: var(--gold); --bg: var(--bg-dark); --border: var(--line);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-dark);
            background-image: radial-gradient(ellipse 550px 450px at 8% 0%, rgba(212,162,78,0.06), transparent), radial-gradient(ellipse 450px 400px at 95% 95%, rgba(123,167,201,0.05), transparent);
            color: var(--text-main); font-family: 'DM Sans', sans-serif; font-size: 16px; line-height: 1.55;
            overflow: hidden; height: 100vh; display: flex;
        }

        /* Botones fijos canónicos */
        .sim-home { position: fixed; top: 14px; left: 14px; z-index: 200; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; text-decoration: none;
            color: var(--sim-home-fg); background: var(--sim-home-bg); border: 1px solid var(--sim-home-bd); border-radius: 10px; transition: transform .2s, color .2s; }
        .sim-home:hover, .sim-home:focus-visible { color: var(--sim-home-hi); transform: scale(1.06); }
        .sim-lang { position: fixed; top: 14px; right: 14px; z-index: 200; min-width: 40px; height: 40px; padding: 0 10px; display: flex; align-items: center; justify-content: center; cursor: pointer;
            font-weight: 600; font-size: 13px; letter-spacing: .06em; font-family: inherit; color: var(--sim-home-fg); background: var(--sim-home-bg); border: 1px solid var(--sim-home-bd); border-radius: 10px; transition: transform .2s, color .2s; }
        .sim-lang:hover, .sim-lang:focus-visible { color: var(--sim-home-hi); transform: scale(1.06); }

        /* ── MAPA: monitor con 4 habitaciones clicables ── */
        #map-container { flex: 3; position: relative; border-right: 1px solid var(--line); padding: 14px; background: #0e0b08; min-width: 0; }
        #map-monitor { position: relative; width: 100%; height: 100%; border: 3px solid #3a3226; border-radius: 10px; background: #0b0906; overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.7), 0 4px 20px rgba(0,0,0,0.5); }
        #roomGrid { position: absolute; inset: 4%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 5%; }
        .room-card { position: relative; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; cursor: default;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.4); transition: box-shadow .3s, opacity .3s, transform .2s; opacity: .55; outline: none; }
        .room-card.is-target { opacity: 1; cursor: pointer; animation: targetPulse 1.4s ease-in-out infinite; }
        .room-card.is-target:hover, .room-card.is-target:focus-visible { transform: scale(1.02); }
        .room-card.is-here { opacity: 1; box-shadow: inset 0 0 30px rgba(0,0,0,0.25), 0 0 22px currentColor; }
        @keyframes targetPulse { 0%, 100% { box-shadow: inset 0 0 30px rgba(0,0,0,0.4), 0 0 8px currentColor; } 50% { box-shadow: inset 0 0 30px rgba(0,0,0,0.4), 0 0 26px currentColor; } }
        .room-badge { position: absolute; top: 10px; left: 10px; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; border: 1px solid rgba(255,255,255,0.15); }
        .room-label { width: 100%; text-align: center; padding: 8px 6px; background: rgba(0,0,0,0.55); }
        .room-label b { display: block; font-size: .92rem; letter-spacing: .3px; }
        .room-label small { display: block; font-size: .74rem; opacity: .85; font-weight: 400; }
        .room-scene { flex: 1; width: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
        .room-prop { font-size: 2.2rem; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }
        .room-onu { background: linear-gradient(180deg, #141d24, #0d151a); border: 2px solid var(--cyan); color: var(--cyan); }
        .room-lab { background: linear-gradient(180deg, #1a1610, #120f0a); border: 2px solid #8a7a5a; color: #c4b48f; }
        .room-bench { position: absolute; bottom: 12px; left: 12%; right: 12%; height: 10px; background: #3a3226; border-radius: 3px; box-shadow: 0 3px 6px rgba(0,0,0,0.5); }
        .room-beaker { position: absolute; bottom: 20px; font-size: 1.8rem; }
        .room-beaker.b1 { left: 38%; } .room-beaker.b2 { left: 56%; font-size: 1.5rem; }
        .room-revA { background: linear-gradient(180deg, #141d16, #0d150f); border: 2px solid var(--green); color: #6bb682; }
        .room-shelf { display: flex; gap: 4px; align-items: flex-end; }
        .room-shelf span { display: block; width: 14px; border-radius: 2px 2px 0 0; }
        .room-shelf span:nth-child(1) { height: 46px; background: #4a8f5f; } .room-shelf span:nth-child(2) { height: 60px; background: #6bb682; }
        .room-shelf span:nth-child(3) { height: 38px; background: #3a7a4a; } .room-shelf span:nth-child(4) { height: 52px; background: #5a9e6f; }
        .room-revB { background: linear-gradient(180deg, #241d10, #18140a); border: 2px solid var(--yellow); color: var(--yellow); }
        .room-neon { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: .82rem; font-weight: 700; color: var(--yellow); text-shadow: 0 0 8px rgba(217,164,65,0.7); white-space: nowrap; }
        .mail { position: absolute; font-size: 1.5rem; animation: mailFloat 2.2s ease-in-out infinite; }
        .mail.m1 { left: 28%; top: 38%; } .mail.m2 { left: 50%; top: 52%; animation-delay: .5s; } .mail.m3 { left: 68%; top: 36%; animation-delay: 1s; }
        @keyframes mailFloat { 0%, 100% { transform: translateY(0) rotate(-6deg); opacity: .85; } 50% { transform: translateY(-8px) rotate(6deg); opacity: 1; } }
        #playerToken { position: absolute; z-index: 5; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 1.9rem; pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(212,162,78,.8)); transition: left .9s ease-in-out, top .9s ease-in-out; }
        .objective { position: absolute; z-index: 6; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: 92%; padding: 8px 16px; border-radius: 100px; text-align: center;
            background: rgba(20,17,13,.92); border: 1px solid var(--gold); color: var(--text-main); font-size: .9rem; opacity: 0; transition: opacity .3s; pointer-events: none; }
        .objective.is-visible { opacity: 1; }

        /* ── PANEL DERECHO: despacho ── */
        #desk { flex: 2; min-width: 340px; max-width: 560px; display: flex; flex-direction: column; background: var(--panel-bg); min-height: 0; }
        #desk-header { padding: 12px 62px 10px 16px; border-bottom: 1px solid var(--line); }
        #desk-title { font-family: 'DM Serif Display', serif; font-size: 1.25rem; color: var(--gold); line-height: 1.2; }
        #chapterStrip { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .chapter-chip { font-size: .74rem; padding: 3px 10px; border-radius: 100px; border: 1px solid var(--line); color: var(--text-dim); }
        .chapter-chip.is-current { border-color: var(--gold); color: var(--gold); background: rgba(212,162,78,.1); }
        .chapter-chip.is-done { color: var(--text-main); border-color: var(--green); }
        #meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
        .meter { background: var(--panel-alt); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; position: relative; }
        .meter-label { font-size: .72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .8px; }
        .meter-value { font-family: 'Share Tech Mono', monospace; font-size: 1.25rem; color: var(--gold); }
        .meter-bar { height: 4px; border-radius: 3px; background: rgba(255,255,255,.08); margin-top: 4px; overflow: hidden; }
        .meter-bar span { display: block; height: 100%; width: 0; background: var(--gold); transition: width .6s ease; }
        .meter-delta { position: absolute; right: 8px; top: 6px; font-family: 'Share Tech Mono', monospace; font-size: .85rem; opacity: 0; transform: translateY(6px); }
        .meter-delta.is-up { color: #6bb682; } .meter-delta.is-down { color: var(--red); }
        .meter-delta.is-show { animation: deltaPop 1.6s ease forwards; }
        @keyframes deltaPop { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
        #glossary { border-bottom: 1px solid var(--line); padding: 0 16px; }
        #glossary summary { cursor: pointer; padding: 8px 0; font-size: .85rem; color: var(--gold); list-style: none; display: flex; justify-content: space-between; }
        #glossary summary::-webkit-details-marker { display: none; }
        .glossary-list { list-style: none; padding: 0 0 10px; display: flex; flex-direction: column; gap: 8px; max-height: 170px; overflow-y: auto; }
        .glossary-item { font-size: .85rem; line-height: 1.35; padding-left: 10px; border-left: 2px solid var(--gold); }
        .glossary-item b { display: block; font-family: 'Share Tech Mono', monospace; font-weight: 400; color: var(--gold); font-size: .83rem; }
        .glossary-empty { font-size: .85rem; color: var(--text-dim); padding-bottom: 10px; }

        #story { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; scrollbar-color: var(--line) var(--panel-bg); }
        .note { max-width: 96%; padding: 10px 14px; border-radius: 12px; background: var(--panel-alt); border: 1px solid var(--line); border-left: 3px solid var(--cyan);
            opacity: 0; transform: translateY(6px); transition: opacity .35s, transform .35s; }
        .note.is-visible { opacity: 1; transform: none; }
        .note strong { color: #fff; }
        .note-you { align-self: flex-end; border-left: 1px solid var(--gold); border-color: var(--gold); background: rgba(212,162,78,.08); }
        .note-ok { border-left-color: var(--green); background: rgba(74,143,95,.1); }
        .note-hint { border-left-color: var(--yellow); background: rgba(217,164,65,.08); }
        .note-chapter { border-left-color: var(--gold); font-family: 'DM Serif Display', serif; font-size: 1.15rem; color: var(--gold); background: transparent; border-top: 0; border-right: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
        .term-row { align-self: flex-start; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 10px; border: 1px dashed var(--gold); background: rgba(212,162,78,.06); font-size: .86rem; opacity: 0; transition: opacity .4s; }
        .term-row.is-visible { opacity: 1; }
        .term-label { font-family: 'Share Tech Mono', monospace; font-size: .68rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); }
        .term-tech { font-family: 'Share Tech Mono', monospace; color: var(--gold); }

        .cons-card, .dice-card { align-self: stretch; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-alt); padding: 10px 14px; opacity: 0; transition: opacity .4s; }
        .cons-card.is-visible, .dice-card.is-visible { opacity: 1; }
        .cons-title, .dice-title { font-family: 'Share Tech Mono', monospace; font-size: .72rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }
        .cons-row { display: grid; grid-template-columns: 24px 82px 1fr; gap: 8px; align-items: start; padding: 5px 0; border-top: 1px solid rgba(255,255,255,.05); font-size: .9rem; }
        .cons-row .delta { font-family: 'Share Tech Mono', monospace; font-weight: 700; }
        .cons-row .delta.up { color: #6bb682; } .cons-row .delta.down { color: var(--red); }
        .dice-bar { height: 10px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; margin: 6px 0; }
        .dice-bar span { display: block; height: 100%; background: var(--red); width: 0; transition: width 1.1s ease; }
        .dice-result { font-weight: 700; min-height: 1.5em; }

        #actions { padding: 10px 16px 14px; border-top: 1px solid var(--line); background: var(--panel-alt); min-height: 62px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
        .btn-primary { text-decoration: none; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font: inherit; font-weight: 700; padding: 11px 26px; border-radius: 100px; border: none; background: var(--gold); color: #1a1610; transition: transform .2s; }
        .btn-primary:hover, .btn-primary:focus-visible { transform: translateY(-2px); }
        .btn-option { cursor: pointer; font: inherit; text-align: left; width: 100%; padding: 10px 14px; border-radius: 12px; color: var(--text-main); background: var(--panel-bg); border: 1px solid #4a4030; transition: border-color .2s, transform .2s; }
        .btn-option:hover, .btn-option:focus-visible { border-color: var(--gold); transform: translateX(3px); }
        .btn-option:disabled { opacity: .5; cursor: default; transform: none; }

        /* ── MODALES: carta y ficha de revista ── */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 300; justify-content: center; align-items: center; padding: 16px; }
        .paper { background: #f0e9d8; color: #2a2418; border-radius: 6px; width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.6); position: relative; }
        .paper-head { display: flex; align-items: center; gap: 12px; padding: 14px 22px; font-family: 'Share Tech Mono', monospace; font-size: .72rem; letter-spacing: .5px; text-transform: uppercase; background: var(--yellow); color: #2a1d05; position: sticky; top: 0; z-index: 2; }
        .paper-head.is-cyan { background: var(--cyan); color: #0a1620; }
        .paper-icon { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1rem; background: rgba(0,0,0,.15); }
        .paper-body { padding: 20px 26px 26px; font-size: .98rem; }
        .paper-body h2 { font-family: 'DM Serif Display', serif; font-weight: 400; font-style: italic; font-size: 1.4rem; margin-bottom: 10px; }
        .paper-body .quote { font-style: italic; margin-bottom: 12px; }
        .paper-body .ask { font-weight: 700; margin-top: 10px; }
        .choice-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
        .choice-row button { flex: 1 1 200px; padding: 12px 14px; border-radius: 100px; cursor: pointer; font: inherit; font-weight: 700; color: #2a2418; background: transparent; border: 2px solid #2a2418; transition: background .2s, color .2s; }
        .choice-row button:hover, .choice-row button:focus-visible { background: #2a2418; color: #f0e9d8; }
        .seal { position: absolute; top: 50%; left: 50%; z-index: 10; opacity: 0; pointer-events: none; transform: translate(-50%,-50%) scale(2.5) rotate(-18deg);
            font-family: 'Share Tech Mono', monospace; font-weight: 700; font-size: 1.5rem; letter-spacing: 3px; padding: 10px 26px; border: 5px solid #8a5a1a; color: #8a5a1a; border-radius: 10px; }
        .seal.is-stamped { animation: stamp .55s cubic-bezier(.2,1.4,.4,1) forwards; }
        @keyframes stamp { 0% { opacity: 0; transform: translate(-50%,-50%) scale(2.5) rotate(-18deg); } 60% { opacity: .95; transform: translate(-50%,-50%) scale(.92) rotate(-14deg); } 100% { opacity: .9; transform: translate(-50%,-50%) scale(1) rotate(-14deg); } }

        .colleague { margin: 6px 0 12px; padding: 8px 12px; border-left: 3px solid #b08a3a; background: rgba(0,0,0,.05); font-style: italic; font-size: .92rem; }
        .file-counter { font-family: 'Share Tech Mono', monospace; font-size: .8rem; color: #6a5a3a; margin-bottom: 8px; }
        .file-item { width: 100%; text-align: left; margin-bottom: 8px; padding: 10px 12px; border-radius: 8px; border: 1px solid #c9bd9f; background: #f7f1e1; cursor: pointer; font: inherit; color: #2a2418; display: block; transition: border-color .2s; }
        .file-item:hover:not(.is-open), .file-item:focus-visible { border-color: #8a5a1a; }
        .file-item .q { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
        .file-item .q i { font-weight: 400; color: #8a7a5a; font-size: .8rem; }
        .file-item .detail { display: none; margin-top: 6px; }
        .file-item .why { display: none; margin-top: 4px; font-size: .88rem; color: #5a4a2a; font-style: italic; }
        .file-item.is-open { cursor: default; background: #fffaf0; }
        .file-item.is-open .detail, .file-item.is-open .why { display: block; }
        .file-item.is-flag { border-color: #b0443f; background: #fbeceb; }
        .file-item .tag { display: none; font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 100px; font-family: 'Share Tech Mono', monospace; }
        .file-item.is-open .tag { display: inline-block; }
        .file-item.is-flag .tag { background: #b0443f; color: #fff; }
        .file-item:not(.is-flag) .tag { background: #3f7a53; color: #fff; }

        /* Final */
        #final-modal .panel { background: var(--panel-bg); border: 1px solid var(--gold); border-radius: 12px; padding: 28px 26px; max-width: 620px; width: 100%; max-height: 94vh; overflow-y: auto; }
        #final-modal h2 { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 1.6rem; margin-bottom: 8px; text-align: center; }
        #final-modal.is-win h2 { color: var(--gold); } #final-modal.is-lose h2 { color: var(--red); }
        #final-message { margin-bottom: 12px; }
        .final-score { text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 2.4rem; margin: 6px 0 12px; }
        .final-score small { font-size: .8rem; color: var(--text-dim); display: block; }
        .final-section { font-family: 'Share Tech Mono', monospace; font-size: .74rem; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); margin: 14px 0 6px; }
        .recap-list { list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: .92rem; }
        .recap-list li { padding: 6px 10px; border-left: 3px solid var(--line); background: var(--panel-alt); border-radius: 0 8px 8px 0; }
        .recap-list li.is-good { border-left-color: var(--green); } .recap-list li.is-bad { border-left-color: var(--red); }
        .flag-list { padding-left: 20px; font-size: .92rem; } .flag-list li { margin-bottom: 4px; }
        .final-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 18px; }
        .btn-secondary { cursor: pointer; font: inherit; font-weight: 700; padding: 11px 24px; border-radius: 100px; color: var(--text-main); background: var(--panel-alt); border: 1px solid #4a4030; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }

        @media (max-width: 900px) {
            body { flex-direction: column; overflow-y: auto; height: auto; min-height: 100vh; }
            #map-container { flex: none; height: 44vh; padding: 8px; border-right: none; border-bottom: 1px solid var(--line); }
            #desk { flex: none; max-width: none; min-width: 0; min-height: 70vh; }
            #desk-header { padding: 12px 62px 10px 16px; }
            .room-label small { display: none; }
            .room-prop { font-size: 1.6rem; }
            #story { max-height: 46vh; }
            .cons-row { grid-template-columns: 22px 70px 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

    
    
        /* === Guía de clase (preguntas para debatir) === */
        .sim-guide{position:fixed;top:50%;right:0;z-index:200;width:30px;height:84px;transform:translateY(-50%);
            display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
            color:var(--sim-home-fg,#888);background:var(--sim-home-bg,rgba(0,0,0,.35));
            border:1px solid var(--sim-home-bd,rgba(255,255,255,.15));border-right:none;border-radius:12px 0 0 12px;
            -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
            transition:width .2s,color .2s}
        .sim-guide:hover,.sim-guide:focus-visible,.sim-guide[aria-expanded="true"]{color:var(--sim-home-hi,#fff);width:36px}
        .sim-guide.is-pulsing{animation:guidePulse 1.6s ease-in-out 4}
        @keyframes guidePulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 7px var(--sim-home-bd,rgba(255,255,255,.2))}}
        .guide-panel{position:fixed;top:0;right:0;bottom:0;z-index:300;width:min(380px,100vw);
            display:flex;flex-direction:column;color:#e8e6e1;
            background:color-mix(in srgb,var(--sim-home-fg,#888) 9%,#0d0d0d);
            border-left:1px solid var(--sim-home-bd,rgba(255,255,255,.15));box-shadow:-12px 0 32px rgba(0,0,0,.5);

/* === Utilidades de interfaz === */
function delay(milliseconds){ return new Promise(resolve => setTimeout(resolve, milliseconds)); }
function createElement(tagName, className, htmlContent){
  const element = document.createElement(tagName);
  if (className) element.className = className;
  if (htmlContent !== undefined) element.innerHTML = htmlContent;
  return element;
}
function scrollBehavior(){ return window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'; }
function shuffled(items){ return items.slice().sort(() => Math.random() - 0.5); }

const storyElement = document.getElementById('story');
const actionsElement = document.getElementById('actions');
const objectiveElement = document.getElementById('objective');

function keepInView(element){ element.scrollIntoView({ behavior: scrollBehavior(), block: 'nearest' }); }
function revealElement(element, visibleClass){ requestAnimationFrame(() => requestAnimationFrame(() => element.classList.add(visibleClass))); }
function clearActions(){ actionsElement.replaceChildren(); }

/* Diálogos y botones (patrón del proyecto) */
function addDialog(html, cssClass){
  const note = createElement('div', 'note' + (cssClass ? ' ' + cssClass : ''), html);
  storyElement.appendChild(note);
  revealElement(note, 'is-visible');
  keepInView(note);
  return note;
}
async function say(lines, cssClass){
  for (const line of [].concat(lines)) { addDialog(line, cssClass); await delay(520); }
}
function addButton(label){
  return new Promise(resolve => {
    clearActions();
    const button = createElement('button', 'btn-primary');
    button.type = 'button';
    button.textContent = label;
    button.addEventListener('click', () => { clearActions(); resolve(); }, { once: true });
    actionsElement.appendChild(button);
    button.focus({ preventScroll: true });
  });
}
function askInline(options){
  return new Promise(resolve => {
    clearActions();
    options.forEach((option, optionIndex) => {
      const button = createElement('button', 'btn-option');
      button.type = 'button';
      button.textContent = option.text;
      button.addEventListener('click', () => { clearActions(); resolve(optionIndex); }, { once: true });
      actionsElement.appendChild(button);
    });
    actionsElement.style.flexDirection = 'column';
    actionsElement.style.alignItems = 'stretch';
  }).finally(() => { actionsElement.style.flexDirection = ''; actionsElement.style.alignItems = ''; });
}
function setObjective(html){
  objectiveElement.innerHTML = html ? '<strong>' + t('objective_prefix') + ':</strong> ' + html : '';
  objectiveElement.classList.toggle('is-visible', Boolean(html));
}

/* Medidores */
function buildMeters(){
  const meters = document.getElementById('meters');
  meters.replaceChildren();
  ['funds', 'time', 'reputation'].forEach(meterKey => {
    const meter = createElement('div', 'meter');
    meter.id = 'meter-' + meterKey;
    meter.appendChild(createElement('div', 'meter-label', t('meter_' + meterKey)));
    meter.appendChild(createElement('div', 'meter-value'));
    const bar = createElement('div', 'meter-bar'); bar.appendChild(document.createElement('span')); meter.appendChild(bar);
    meter.appendChild(createElement('div', 'meter-delta'));
    meters.appendChild(meter);
  });
  renderMeters();
}
function formatNumber(value){ return Number.isInteger(value) ? String(value) : value.toFixed(1); }
function formatTime(months){ return formatNumber(months) + ' ' + (months === 1 ? t('unit_month') : t('unit_months')); }
function formatFunds(amount){ return '$' + Math.round(amount).toLocaleString('en-US'); }
function renderMeters(){
  state.reputation = Math.max(0, Math.min(100, state.reputation));
  document.querySelector('#meter-funds .meter-value').textContent = formatFunds(state.funds);
  document.querySelector('#meter-time .meter-value').textContent = formatTime(Math.max(0, state.timeMonths));
  document.querySelector('#meter-reputation .meter-value').textContent = formatNumber(state.reputation);
  document.querySelector('#meter-funds .meter-bar span').style.width = Math.max(0, Math.min(100, state.funds / 50)) + '%';
  document.querySelector('#meter-time .meter-bar span').style.width = Math.max(0, state.timeMonths / INITIAL_TIME_MONTHS * 100) + '%';
  document.querySelector('#meter-reputation .meter-bar span').style.width = state.reputation + '%';
}
function applyDelta(meterKey, amount){
  if (!amount) return;
  if (meterKey === 'funds') state.funds += amount;
  if (meterKey === 'time') state.timeMonths += amount;
  if (meterKey === 'reputation') state.reputation += amount;
  renderMeters();
  const deltaElement = document.querySelector('#meter-' + meterKey + ' .meter-delta');
  deltaElement.textContent = (amount > 0 ? '+' : '−') + (meterKey === 'funds' ? '$' + Math.abs(amount).toLocaleString('en-US') : formatNumber(Math.abs(amount)));
  deltaElement.className = 'meter-delta ' + (amount > 0 ? 'is-up' : 'is-down');
  void deltaElement.offsetWidth;
  deltaElement.classList.add('is-show');
}
const METER_ICONS = { funds: '💰', time: '⏳', reputation: '⭐' };
/* Tarjeta de consecuencias: aplica los cambios y explica cada uno */
async function showConsequences(rows){
  const card = createElement('div', 'cons-card');
  card.appendChild(createElement('div', 'cons-title', t('consequence_title')));
  rows.forEach(row => {
    const rowElement = createElement('div', 'cons-row');
    rowElement.appendChild(createElement('span', '', METER_ICONS[row.meter]));
    const deltaText = (row.amount > 0 ? '+' : '−') + (row.meter === 'funds' ? '$' + Math.abs(row.amount).toLocaleString('en-US') : row.meter === 'time' ? formatTime(Math.abs(row.amount)) : formatNumber(Math.abs(row.amount)));
    const goodForPlayer = row.meter === 'time' ? row.amount > 0 : row.amount > 0;
    rowElement.appendChild(createElement('span', 'delta ' + (goodForPlayer ? 'up' : 'down'), deltaText));
    rowElement.appendChild(createElement('span', '', row.text));
    card.appendChild(rowElement);
  });
  storyElement.appendChild(card);
  revealElement(card, 'is-visible');
  keepInView(card);
  rows.forEach(row => applyDelta(row.meter, row.amount));
  await delay(900);
}
/* Dado visible: la detección no es magia, tiene una probabilidad explícita */
async function rollDetection(probabilityPercent){
  const card = createElement('div', 'dice-card');
  card.appendChild(createElement('div', 'dice-title', t('dice_title') + ': ' + probabilityPercent + '%'));
  const bar = createElement('div', 'dice-bar'); const fill = document.createElement('span'); bar.appendChild(fill);
  const result = createElement('div', 'dice-result', t('dice_rolling'));
  card.append(bar, result);
  storyElement.appendChild(card);
  revealElement(card, 'is-visible');
  keepInView(card);
  await delay(250);
  fill.style.width = probabilityPercent + '%';
  await delay(1500);
  const wasDetected = Math.random() * 100 < probabilityPercent;
  result.textContent = wasDetected ? t('dice_detected') : t('dice_clear');
  result.style.color = wasDetected ? 'var(--red)' : 'var(--yellow)';
  await delay(500);
  return wasDetected;
}

function addTermChips(termKeys){
  termKeys.forEach(termKey => {

/* Capítulos */
function buildChapterStrip(){
  const strip = document.getElementById('chapterStrip');
  strip.replaceChildren();
  CHAPTER_KEYS.forEach((chapterKey, chapterIndex) => {
    const chip = createElement('span', 'chapter-chip', t(chapterKey));
    chip.dataset.chapter = chapterIndex;
    strip.appendChild(chip);
  });
}
function setChapter(chapterIndex){
  document.querySelectorAll('#chapterStrip .chapter-chip').forEach(chip => {
    const index = Number(chip.dataset.chapter);
    chip.classList.toggle('is-current', index === chapterIndex);
    chip.classList.toggle('is-done', index < chapterIndex);
  });

/* Mapa: habitaciones clicables y ficha del investigador */
const roomElements = {};
document.querySelectorAll('.room-card').forEach(roomElement => {
  roomElements[roomElement.dataset.room] = roomElement;
  const activate = () => { if (state.allowedRooms.includes(roomElement.dataset.room) && state.onRoomChosen) state.onRoomChosen(roomElement.dataset.room); };
  roomElement.addEventListener('click', activate);
  roomElement.addEventListener('keydown', keyEvent => { if (keyEvent.key === 'Enter' || keyEvent.key === ' ') { keyEvent.preventDefault(); activate(); } });
});
function markRooms(){
  Object.entries(roomElements).forEach(([roomId, roomElement]) => {
    const isTarget = state.allowedRooms.includes(roomId);
    roomElement.classList.toggle('is-target', isTarget);
    roomElement.classList.toggle('is-here', state.currentRoom === roomId);
    roomElement.setAttribute('aria-disabled', String(!isTarget));
    roomElement.tabIndex = isTarget ? 0 : -1;
  });
}
function moveTokenTo(roomId){
  const roomElement = roomElements[roomId];
  const monitorRect = document.getElementById('map-monitor').getBoundingClientRect();
  const roomRect = roomElement.getBoundingClientRect();
  const token = document.getElementById('playerToken');
  token.style.left = (roomRect.left - monitorRect.left + roomRect.width / 2) + 'px';
  token.style.top = (roomRect.top - monitorRect.top + roomRect.height * 0.5) + 'px';
  state.currentRoom = roomId;
  markRooms();
  return delay(1000);
}
function travelToRoom(roomIds, objectiveHtml){
  return new Promise(resolve => {
    clearActions();
    state.allowedRooms = roomIds;
    markRooms();
    setObjective(objectiveHtml);
    state.onRoomChosen = async roomId => {
      state.onRoomChosen = null;
      state.allowedRooms = [];
      setObjective('');
      await moveTokenTo(roomId);
      resolve(roomId);
    };
  });
}
window.addEventListener('resize', () => { if (state.currentRoom) { const token = document.getElementById('playerToken'); const keepTransition = token.style.transition; token.style.transition = 'none'; moveTokenTo(state.currentRoom); token.style.transition = keepTransition; } });

/* Carta de decisión: los dos botones no están etiquetados como «bueno» o «malo» y su orden es aleatorio */
function showLetter(letterData, icon){
  return new Promise(resolve => {
    const overlay = document.getElementById('letterOverlay');
    const seal = document.getElementById('letterSeal');
    seal.className = 'seal'; seal.textContent = '';
    document.getElementById('letterIcon').textContent = icon;
    document.getElementById('letterKicker').textContent = t('letter_kicker');
    document.getElementById('letterTitle').textContent = letterData.title;
    document.getElementById('letterQuote').textContent = letterData.quote;
    document.getElementById('letterAsk').textContent = letterData.ask;
    const choices = document.getElementById('letterChoices');
    choices.replaceChildren();
    shuffled(['shortcut', 'honest']).forEach(choiceKey => {
      const button = createElement('button');
      button.type = 'button';
      button.textContent = letterData[choiceKey];
      button.addEventListener('click', () => {
        choices.querySelectorAll('button').forEach(other => { other.disabled = true; });
        seal.textContent = t('stamp_decided');
        seal.className = 'seal is-stamped';
        setTimeout(() => { overlay.style.display = 'none'; resolve(choiceKey); }, 750);
      }, { once: true });
      choices.appendChild(button);
    });
    overlay.style.display = 'flex';
    choices.querySelector('button').focus();
  });
}

/* Ficha de revista: el estudiante inspecciona ítem por ítem y descubre las señales */
function showJournalFile(journalKey){
  return new Promise(resolve => {
    const journal = TEXT.journals[journalKey];
    const overlay = document.getElementById('journalOverlay');
    document.getElementById('journalKicker').textContent = t('journal_kicker') + ' · ' + journal.sub;
    document.getElementById('journalTitle').textContent = journal.name;
    const colleague = document.getElementById('journalColleague');
    colleague.style.display = journal.colleague ? '' : 'none';
    colleague.textContent = journal.colleague;
    const counter = document.getElementById('journalCounter');
    const itemsContainer = document.getElementById('journalItems');
    itemsContainer.replaceChildren();
    const updateCounter = () => {
      const flagsFound = [...state.openedItems[journalKey]].filter(itemIndex => journal.items[itemIndex].flag).length;
      counter.textContent = fmt(t('journal_counter'), { found: flagsFound, opened: state.openedItems[journalKey].size, total: journal.items.length });
    };
    journal.items.forEach((item, itemIndex) => {
      const button = createElement('button', 'file-item');
      button.type = 'button';
      const question = createElement('div', 'q');
      question.appendChild(createElement('span', '', item.question));
      question.appendChild(createElement('i', 'fa-solid fa-magnifying-glass'));
      button.appendChild(question);
      const detail = createElement('div', 'detail', item.detail + ' ');
      detail.appendChild(createElement('span', 'tag', item.flag ? t('tag_alert') : t('tag_normal')));
      button.appendChild(detail);
      button.appendChild(createElement('div', 'why', item.why));
      if (item.flag) button.classList.add('is-flag');
      if (state.openedItems[journalKey].has(itemIndex)) button.classList.add('is-open');
      button.addEventListener('click', () => {
        button.classList.add('is-open');
        state.openedItems[journalKey].add(itemIndex);
        updateCounter();
      });
      itemsContainer.appendChild(button);
    });
    updateCounter();
    const choices = document.getElementById('journalChoices');
    choices.replaceChildren();
    const closeWith = decision => { overlay.style.display = 'none'; resolve(decision); };
    const submitButton = createElement('button'); submitButton.type = 'button'; submitButton.textContent = t('journal_submit');
    const leaveButton = createElement('button'); leaveButton.type = 'button'; leaveButton.textContent = t('journal_leave');
    submitButton.addEventListener('click', () => closeWith('submit'), { once: true });
    leaveButton.addEventListener('click', () => closeWith('leave'), { once: true });
    choices.append(leaveButton, submitButton);
    const tapHint = createElement('div', 'file-counter', t('journal_tap'));
    itemsContainer.before(tapHint);
    overlay.querySelector('.paper').scrollTop = 0;
    overlay.style.display = 'flex';
    // la pista se elimina al cerrar para no duplicarse la próxima vez
    const cleanupHint = () => tapHint.remove();
    submitButton.addEventListener('click', cleanupHint, { once: true });
    leaveButton.addEventListener('click', cleanupHint, { once: true });
  });
}

/* === Guion de la simulación === */
async function chapterHook(){
  setChapter(0);
  await say(TEXT.hookIntro);
  addDialog(TEXT.hookQuestion);
  const optionIndex = await askInline(TEXT.hookOptions);
  addDialog(TEXT.hookOptions[optionIndex].text, 'note-you');
  await delay(300);
  addDialog(TEXT.hookOptions[optionIndex].feedback, 'note-ok');
  await delay(700);
  if (optionIndex === 1) addTermChips(['peerReview']);
  await say(TEXT.hookRules);
  await addButton(t('begin'));
  if (!state.discoveredTerms.has('peerReview')) addTermChips(['peerReview']);
}

async function chapterFunding(){
  setChapter(1);
  addDialog(TEXT.chapter1Title, 'note-chapter');
  await travelToRoom(['onu'], TEXT.chapter1Goto);
  await say(TEXT.chapter1Intro);
  addTermChips(['grant']);
  await delay(500);
  const choice = await showLetter(TEXT.ghostLetter, '📩');
  state.ghostChoice = choice;
  if (choice === 'honest') {
    await say(TEXT.ghostHonest);
    await showConsequences([
      { meter: 'time', amount: -2, text: TEXT.ghostHonestRows.time },
      { meter: 'reputation', amount: 5, text: TEXT.ghostHonestRows.reputation },
      { meter: 'funds', amount: 5000, text: TEXT.ghostHonestRows.funds } ]);
  } else {
    await say(TEXT.ghostShortcut);
    state.ghostDetected = await rollDetection(50);
    addTermChips(['ghost']);
    if (state.ghostDetected) {
      await say(TEXT.ghostDetected);
      await showConsequences([
        { meter: 'reputation', amount: -20, text: TEXT.ghostDetectedRows.reputation },
        { meter: 'time', amount: -2.5, text: TEXT.ghostDetectedRows.time },
        { meter: 'funds', amount: 5000, text: TEXT.ghostDetectedRows.funds } ]);
    } else {
      await say(TEXT.ghostClear);
      await showConsequences([
        { meter: 'time', amount: -0.5, text: TEXT.ghostClearRows.time },
        { meter: 'funds', amount: 4250, text: TEXT.ghostClearRows.funds } ]);
    }
  }
  await addButton(t('next'));
}

async function chapterData(){
  setChapter(2);
  addDialog(TEXT.chapter2Title, 'note-chapter');
  await travelToRoom(['lab'], TEXT.chapter2Goto);
  await say(TEXT.chapter2Intro);
  addTermChips(['pvalue']);
  await delay(500);
  const choice = await showLetter(TEXT.dataLetter, '🧪');
  state.dataChoice = choice;
  if (choice === 'honest') {
    await say(TEXT.dataHonest);
    await showConsequences([
      { meter: 'time', amount: -1.5, text: TEXT.dataHonestRows.time },
      { meter: 'reputation', amount: 10, text: TEXT.dataHonestRows.reputation } ]);
    addTermChips(['nullResult']);
  } else {
    await say(TEXT.dataShortcut);
    await showConsequences([
      { meter: 'time', amount: -1, text: TEXT.dataShortcutRows.time },
      { meter: 'reputation', amount: 10, text: TEXT.dataShortcutRows.reputation } ]);
    addTermChips(['dataFraud']);
  }
  await addButton(t('next'));
}

/* Envío a la Revista A: revisión por pares, posible descubrimiento de manipulación y «todavía no» */
async function submitToJournalA(){
  state.journal = 'A';
  await say(TEXT.submitA);
  addTermChips(['peerReview', 'indexed']);
  await showConsequences([{ meter: 'time', amount: -3, text: TEXT.submitARows.time }]);
  if (state.dataChoice === 'shortcut') {
    await say(TEXT.rawDataRequest);
    addTermChips(['rawData']);
    state.fraudDetected = await rollDetection(70);
    if (state.fraudDetected) {
      await say(TEXT.fraudCaught);
      await showConsequences([{ meter: 'reputation', amount: -45, text: TEXT.outcomes.fraudCaught.message }]);
      return endGame('fraudCaught');
    }
    await say(TEXT.fraudClear);
  }
  const choice = await showLetter(TEXT.revisionLetter, '✉️');
  addTermChips(['resilience']);
  if (choice === 'honest') {
    state.resubmitted = true;
    await showConsequences([
      { meter: 'time', amount: -3, text: TEXT.revisionRows.time },
      { meter: 'reputation', amount: 35, text: TEXT.revisionRows.reputation } ]);
    await say(TEXT.acceptedA);
    addTermChips(['q1']);
    return endGame('legit');
  }
  state.gaveUpOnA = true;
  await say(TEXT.gaveUp);
  return 'abandon';
}

async function submitToJournalB(){
  state.journal = 'B';
  await say(TEXT.submitB);
  await showConsequences([
    { meter: 'funds', amount: -900, text: TEXT.submitBRows.funds },
    { meter: 'time', amount: -0.1, text: TEXT.submitBRows.time } ]);
  addTermChips(['predatory']);
  await delay(500);
  await say(TEXT.auditB);
  addTermChips(['audit']);
  await showConsequences([{ meter: 'reputation', amount: -50, text: TEXT.auditBRows.reputation }]);
  return endGame('predatory');
}

async function chapterPublish(){
  setChapter(3);
  addDialog(TEXT.chapter3Title, 'note-chapter');
  await say(TEXT.chapter3Intro);
  while (!state.ended) {
    const rooms = state.gaveUpOnA ? ['journalB'] : ['journalA', 'journalB'];
    if (state.gaveUpOnA) addDialog(TEXT.chapter3OnlyB);
    const roomId = await travelToRoom(rooms, TEXT.chapter3Goto);
    const journalKey = roomId === 'journalA' ? 'A' : 'B';
    const decision = await showJournalFile(journalKey);
    if (decision === 'leave') { addDialog(TEXT.chapter3Back); continue; }
    if (journalKey === 'A') {
      const result = await submitToJournalA();
      if (result === 'abandon') continue;
    } else {
      await submitToJournalB();
    }
    return;
  }
}

/* Nombre del estudiante (solo sesión) */
function obtenerNombreUsuario(callback) {
  const savedName = sessionStorage.getItem('nombreEstudianteSim');
  if (savedName) { callback(savedName); return; }
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.72);display:flex;align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(5px)';
  const modal = document.createElement('div');
  modal.style.cssText = 'background:var(--card, #222);border:1px solid var(--accent, rgba(255,255,255,0.1));border-radius:12px;padding:32px;max-width:400px;width:90%;text-align:center;';
  modal.innerHTML = `
    <p style="font-size:16px;color:var(--txt, #fff);margin-bottom:24px;font-weight:600">${t('name_q')}</p>
    <input type="text" id="input-nombre" style="width:100%;padding:10px 14px;border:1px solid var(--border, rgba(255,255,255,0.2));
      border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg, #111);color:var(--txt, #fff);margin-bottom:16px"
      placeholder="${t('name_ph')}" autocomplete="off">
    <p style="font-size:12px;color:var(--txt-3, #999);margin-bottom:20px">${t('name_note')}</p>
    <button id="btn-continuar" style="background:var(--accent, #818cf8);color:var(--bg, #000);border:none;
      padding:10px 28px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">${t('name_btn')}</button>
  `;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  const nameInput = modal.querySelector('#input-nombre');
  const continueButton = modal.querySelector('#btn-continuar');
  const submit = () => {
    const studentName = nameInput.value.trim() || t('name_default');
    sessionStorage.setItem('nombreEstudianteSim', studentName);
    overlay.remove();
    callback(studentName);
  };
  continueButton.addEventListener('click', submit);
  nameInput.addEventListener('keypress', keyEvent => keyEvent.key === 'Enter' && submit());
  nameInput.focus();
}

/* === Pantalla final === */
function buildRecap(outcomeKey){
  const items = [];
  const R = TEXT.recap;
  if (state.ghostChoice === 'honest') items.push({ text: R.ghostHonest, good: true });
  else items.push({ text: state.ghostDetected ? R.ghostCaught : R.ghostClear, good: false });
  if (state.dataChoice === 'honest') items.push({ text: R.dataHonest, good: true });
  else items.push({ text: state.fraudDetected ? R.dataCaught : R.dataClear, good: false });
  if (state.gaveUpOnA) items.push({ text: R.gaveUpOnA, good: false });
  if (state.resubmitted) items.push({ text: R.resilience, good: true });
  if (outcomeKey === 'legit') items.push({ text: R.journalA, good: true });
  if (outcomeKey === 'predatory') items.push({ text: R.journalB, good: false });
  return items;
}
function endGame(outcomeKey){
  if (state.ended) return;
  state.ended = true;
  clearActions();
  setObjective('');
  localStorage.setItem('simlab_done_simlab_fin', Date.now());
  const wins = outcomeKey === 'legit';
  const outcome = TEXT.outcomes[outcomeKey];
  return addButton(t('see_result')).then(() => new Promise(resolve => {
    obtenerNombreUsuario(studentName => {
      const modal = document.getElementById('final-modal');
      modal.classList.toggle('is-win', wins);
      modal.classList.toggle('is-lose', !wins);
      document.getElementById('final-title').textContent = outcome.title;
      let message = studentName + ', ' + outcome.message.charAt(0).toLowerCase() + outcome.message.slice(1);
      if (wins && (state.ghostChoice === 'shortcut' || state.dataChoice === 'shortcut')) message += '<br><br><span style="color:var(--yellow)">' + t('final_debt') + '</span>';
      document.getElementById('final-message').innerHTML = message;
      state.reputation = Math.max(0, Math.min(100, state.reputation));
      document.getElementById('final-score').innerHTML = formatNumber(state.reputation) + '<small>' + t('final_score_label') + '</small>';
      document.getElementById('final-recap-title').textContent = t('final_recap_title');
      const recapList = document.getElementById('final-recap');
      recapList.replaceChildren();
      buildRecap(outcomeKey).forEach(item => recapList.appendChild(createElement('li', item.good ? 'is-good' : 'is-bad', item.text)));
      document.getElementById('final-flags-title').textContent = t('final_flags_title');
      const flagList = document.getElementById('final-flags');
      flagList.replaceChildren();
      TEXT.journals.B.items.forEach(item => flagList.appendChild(createElement('li', '', item.short)));
      const foundCount = [...state.openedItems.B].length;
      if (foundCount > 0) flagList.appendChild(createElement('li', '', '<strong>' + fmt(t('final_found_flags'), { found: foundCount, total: TEXT.journals.B.items.length }) + '</strong>'));
      const actions = document.getElementById('final-actions');
      actions.replaceChildren();
      const homeLink = createElement('a', 'btn-primary', '<i class="fa-solid fa-house"></i> ' + t('final_home'));
      homeLink.href = 'index.html';
      const repeatButton = createElement('button', 'btn-secondary', '<i class="fa-solid fa-rotate-left"></i> ' + t('final_again'));
      repeatButton.type = 'button';
      repeatButton.addEventListener('click', () => location.reload());
      actions.append(homeLink, repeatButton);
      modal.style.display = 'flex';
      resolve();
    });
  }));
}

/* === Inicio === */
buildMeters();
buildChapterStrip();
renderGlossary();
(async function runSimulation(){
  await chapterHook();
  await chapterFunding();
  await chapterData();
  await chapterPublish();
})();

    tabsContainer.appendChild(tabButton);
  });

  function setPanelOpen(isOpen){
    guidePanel.classList.toggle('is-open', isOpen);
    guideButton.setAttribute('aria-expanded', String(isOpen));
    if (isOpen) { hideToast(); closeButton.focus(); } else { guideButton.focus(); }
  }
  guideButton.addEventListener('click', () => setPanelOpen(!guidePanel.classList.contains('is-open')));
  closeButton.addEventListener('click', () => setPanelOpen(false));
  document.addEventListener('keydown', keyEvent => {
    if (keyEvent.key === 'Escape' && guidePanel.classList.contains('is-open')) setPanelOpen(false);
  });

  /* Abre la guía completa en una pestaña nueva (útil para proyectarla o tenerla aparte) */
  function openGuideInNewTab(){
    const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--sim-home-fg').trim() || '#10a37f';
    const escapeHtml = rawText => rawText.replace(/[&<>"]/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[character]));
    const sectionsHtml = guidePhases.map(phaseKey =>
      '<section><h2>' + escapeHtml(guideUi[phaseKey]) + '</h2><ol>' +
      guideQuestions[phaseKey].map(questionText => '<li>' + escapeHtml(questionText) + '</li>').join('') +
      '</ol></section>').join('');
    const simulationName = escapeHtml(document.title || '');
    const pageHtml = '<!doctype html><html lang="' + guideLang + '"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>' + simulationName + ' — ' + escapeHtml(guideUi.title) + '</title><style>' +
      ':root{--accent:' + accentColor + '}*{box-sizing:border-box}' +
      'body{margin:0;background:#0f0f0f;color:#e8e6e1;font:17px/1.6 Georgia,"Times New Roman",serif}' +
      'main{max-width:760px;margin:0 auto;padding:40px 24px 64px}' +
      'h1{margin:0 0 4px;font-size:28px;color:var(--accent)}.sim{margin:0 0 32px;opacity:.65;font-size:15px}' +
      'h2{margin:36px 0 12px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:6px}' +
      'ol{margin:0;padding-left:26px}li{margin-bottom:16px;padding-left:6px}li::marker{color:var(--accent);font-weight:700}' +
      '@media print{body{background:#fff;color:#111}h1,h2,li::marker{color:#111}}' +
      '</style></head><body><main><h1>' + escapeHtml(guideUi.title) + '</h1><p class="sim">' + simulationName + '</p>' +
      sectionsHtml + '</main></body></html>';
    const pageUrl = URL.createObjectURL(new Blob([pageHtml], { type: 'text/html;charset=utf-8' }));
    window.open(pageUrl, 'simlab_guide');
  }
  popoutButton.addEventListener('click', openGuideInNewTab);

  let toastTimer = null;
  function hideToast(){
    clearTimeout(toastTimer);
    guideToast.classList.remove('is-visible');
    guideButton.classList.remove('is-pulsing');
  }
  function announceCompletion(){
    if (guidePanel.classList.contains('is-open')) return;
    guideToast.replaceChildren();
    const toastText = document.createElement('span');
    toastText.textContent = guideUi.toast;
    const openButton = document.createElement('button');
    openButton.type = 'button';
    openButton.className = 'guide-toast-open';
    openButton.textContent = guideUi.toastOpen;
    openButton.addEventListener('click', () => { showPhase('after'); setPanelOpen(true); });
    const dismissButton = document.createElement('button');
    dismissButton.type = 'button';
    dismissButton.className = 'guide-toast-dismiss';
    dismissButton.setAttribute('aria-label', guideUi.close);
    dismissButton.textContent = '✕';
    dismissButton.addEventListener('click', hideToast);
    guideToast.append(toastText, openButton, dismissButton);
    guideToast.classList.add('is-visible');
    guideButton.classList.add('is-pulsing');
    toastTimer = setTimeout(hideToast, 20000);
  }

  /* Detecta el fin de la simulación sin tocar su lógica interna */
  try {
    const nativeSetItem = Storage.prototype.setItem;
    Storage.prototype.setItem = function(storageKey, storageValue){
      nativeSetItem.apply(this, arguments);
      if (this === window.localStorage && String(storageKey).indexOf('simlab_done_') === 0) {
        setTimeout(announceCompletion, 1500);
      }
    };
  } catch (storageError) { /* sin aviso automático; el botón sigue disponible */ }

  showPhase('before');
})();
</script>
</body>
</html>
